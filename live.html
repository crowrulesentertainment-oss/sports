<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Center | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js?v=19.0"></script></head><body><script>shell("live")</script><section class="hero"><div class="eyebrow">LIVE SPORTS COMMAND CENTER</div><h1>THE GAME<br><span>IS ON.</span></h1><p>One live hub for CrowRules Sports scores, schedules, teams, standings and original media.</p><div class="actions"><a class="btn primary" href="schedule.html">FULL SCHEDULE</a><a class="btn" href="teams.html">TEAMS</a><a class="btn" href="media.html">WATCH / LISTEN</a></div></section><section class="section"><div class="grid"><div class="card"><div class="eyebrow">GAMES</div><div class="kpi" id="games">—</div></div><div class="card"><div class="eyebrow">LIVE</div><div class="kpi" id="live">—</div></div><div class="card"><div class="eyebrow">TEAMS</div><div class="kpi" id="teams">—</div></div><div class="card"><div class="eyebrow">MEDIA</div><div class="kpi" id="media">—</div></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">LIVE / RECENT</div><h2>SCOREBOARD</h2></div><button class="btn" id="refresh">REFRESH</button></div><div id="board" class="grid"><div class="card">Loading scoreboard…</div></div></section><script>async function load(){const g=await sb.from("cr_sports_games").select("*").limit(24);const t=await sb.from("cr_sports_teams").select("id");const m=await sb.from("cr_sports_media").select("id").limit(6);const games=g.data||[];gamesCount.textContent=games.length;teams.textContent=(t.data||[]).length;media.textContent=(m.data||[]).length;live.textContent=games.filter(x=>/live|in progress|playing/i.test(x.status||"")).length;board.innerHTML=games.length?games.map(x=>'<article class="card"><span class="tag">'+(x.status||"SCHEDULED")+'</span><h3>'+(x.away_team_name||x.away_team||"Away")+' <span class="muted">at</span> '+(x.home_team_name||x.home_team||"Home")+'</h3><div class="kpi">'+(x.away_score??"—")+' — '+(x.home_score??"—")+'</div></article>').join(""):"<div class='card'><h3>No games loaded yet.</h3><p class='muted'>The scoreboard is connected and ready for CrowRules Sports game data.</p></div>"}gamesCount=document.getElementById("games");teams=document.getElementById("teams");media=document.getElementById("media");live=document.getElementById("live");board=document.getElementById("board");document.getElementById("refresh").onclick=load;loadSession();load();setInterval(load,60000);</script><script>footer()</script></body></html>
