<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrestler Profile | CrowRules Sports</title>
<link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js?v=23.0"></script>
<style>
:root{--red:#e10600;--bg:#050506;--panel:#0d0d11;--line:#25252c;--muted:#777;--text:#eee}body{background:var(--bg);color:var(--text)}.wrap{max-width:1400px;margin:auto;padding:0 24px}.hero{padding:65px 0 45px;background:radial-gradient(circle at 80% 15%,rgba(225,6,0,.22),transparent 35%),linear-gradient(135deg,#050506,#111117)}.back{color:#aaa;text-decoration:none;font:800 9px Orbitron}.profile{display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:stretch}.portrait{min-height:430px;background:#0a0a0d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}.avatar{font:900 80px Orbitron;color:#333}.eyebrow{font:800 9px Orbitron;letter-spacing:2px;color:#888}.hero h1{font:900 clamp(40px,6vw,78px)/.95 Orbitron;margin:15px 0;letter-spacing:-3px}.hero h1 span{color:var(--red)}.meta{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:7px 10px;border:1px solid #303038;background:#0d0d11;font:800 8px Orbitron;color:#aaa}.bio{max-width:900px;color:#999;line-height:1.8;font-size:13px;margin:22px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:25px}.stat,.card{background:var(--panel);border:1px solid var(--line);padding:18px}.stat b{display:block;font:900 25px Orbitron}.stat span{font:800 7px Orbitron;color:#666}.section{padding:42px 0}.section h2{font:900 26px Orbitron}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h3{font:800 15px Montserrat;margin:5px 0 10px}.muted{color:#777;font-size:10px;line-height:1.7}.list{border:1px solid var(--line);background:#0a0a0d}.row{display:grid;grid-template-columns:100px 1fr auto;gap:12px;padding:13px;border-bottom:1px solid #1d1d22;align-items:center}.row:last-child{border-bottom:0}.date{font:800 9px Orbitron;color:#777}.result{font:800 11px Montserrat}.win{color:#8ee28e}.loss{color:#e77}.title{color:#e10600;font:800 9px Orbitron}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gallery figure{margin:0;background:#0a0a0d;border:1px solid var(--line);aspect-ratio:1;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:cover}.source{display:inline-block;color:#aaa;text-decoration:none;font:800 8px Orbitron;border:1px solid #333;padding:10px 12px}.empty{padding:28px;text-align:center;border:1px dashed #303036;color:#777}.error{color:#f77}@media(max-width:900px){.profile{grid-template-columns:1fr}.portrait{min-height:320px}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.portrait{min-height:280px}}
</style></head>
<body><script>shell("combat")</script>
<header class="hero"><div class="wrap"><a class="back" href="combat.html#rosters">← BACK TO COMBAT CENTER</a><div id="profile"><div class="empty">Loading wrestler profile…</div></div></div></header>
<main class="wrap">
<section class="section"><div class="grid">
<div class="card"><div class="eyebrow">CHAMPIONSHIPS</div><h2>Title History</h2><div id="titles" class="list"><div class="empty">Loading…</div></div></div>
<div class="card"><div class="eyebrow">MATCH HISTORY</div><h2>Record</h2><div id="record" class="list"><div class="empty">Loading…</div></div></div>
<div class="card"><div class="eyebrow">UPCOMING</div><h2>Appearances</h2><div id="upcoming" class="list"><div class="empty">Loading…</div></div></div>
</div></section>
<section class="section"><div class="eyebrow">PROFILE MEDIA</div><h2>Image Gallery</h2><div id="gallery" class="gallery"><div class="empty">No verified gallery images available.</div></div></section>
<section class="section"><div class="card"><div class="eyebrow">SOURCE + PROVIDER</div><h2>Profile Metadata</h2><div id="sources" class="muted">Loading…</div></div></section>
</main><script>
const SB=window.sb||window.supabaseClient,esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),p=new URLSearchParams(location.search),slug=p.get("slug"),id=p.get("id");
const initials=n=>String(n||"?").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase(),date=v=>v?new Date(v).toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"}):"TBD";
function src(x){return x?.raw_payload?.source_url||x?.source_url||(x.organization==="AEW"?"https://www.allelitewrestling.com/aew-roster":"https://www.wwe.com/superstars")}
function img(x){return x?.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'" onerror="this.outerHTML='<div class=\'avatar\'>'+esc(initials(x.name))+'</div>'">':'<div class="avatar">'+esc(initials(x.name))+'</div>'}
async function boot(){
 if(!SB)return fail("Supabase client unavailable.");
 let q=SB.from("cr_sports_wrestlers").select("*").limit(1); if(id)q=q.eq("id",id); else if(slug)q=q.eq("slug",slug); else return fail("No wrestler was specified.");
 const wr=await q.maybeSingle(); if(wr.error||!wr.data)return fail(wr.error?.message||"Wrestler profile not found.");
 const w=wr.data; document.title=w.name+" | CrowRules Sports";
 const source=src(w), payload=w.raw_payload||{};
 document.getElementById("profile").innerHTML='<div class="profile"><div class="portrait">'+img(w)+'</div><div><div class="eyebrow">'+esc(w.organization)+' • WRESTLER PROFILE</div><h1>'+esc(w.name.split(" ").slice(0,-1).join(" ")||w.name)+' <span>'+esc(w.name.split(" ").slice(-1)[0]||"")+'</span></h1><div class="meta">'+[w.nickname,w.hometown,w.country,w.gender,w.weight_class,w.status].filter(Boolean).map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</div><p class="bio">'+esc(payload.biography||payload.bio||"Biography information has not yet been supplied by the current provider.")+'</p><div class="stats"><div class="stat"><b id="wins">—</b><span>WINS</span></div><div class="stat"><b id="losses">—</b><span>LOSSES</span></div><div class="stat"><b id="draws">—</b><span>DRAWS</span></div><div class="stat"><b id="matches">—</b><span>MATCHES</span></div><div class="stat"><b id="titlesN">—</b><span>TITLES</span></div></div></div></div>';
 const name=w.name.toLowerCase();
 const mr=await SB.from("cr_sports_wrestling_matches").select("*").in("organization",[w.organization]).or("red_name.ilike.%"+w.name+"%,blue_name.ilike.%"+w.name+"%,winner_name.ilike.%"+w.name+"%").order("provider_updated_at",{ascending:false}).limit(500);
 const ms=mr.error?[]:(mr.data||[]);
 let wins=0,losses=0,draws=0;ms.forEach(m=>{if(!m.winner_name)return;if(m.winner_name.toLowerCase()===name)wins++;else if((m.red_name||"").toLowerCase()===name||(m.blue_name||"").toLowerCase()===name)losses++});
 document.getElementById("wins").textContent=wins;document.getElementById("losses").textContent=losses;document.getElementById("draws").textContent=draws;document.getElementById("matches").textContent=ms.length;
 document.getElementById("record").innerHTML=ms.length?ms.slice(0,30).map(m=>'<div class="row"><div class="date">'+esc(date(m.provider_updated_at))+'</div><div class="result">'+esc(m.red_name||"Unknown")+' vs '+esc(m.blue_name||"Unknown")+'<div class="muted">'+esc([m.result,m.method,m.round].filter(Boolean).join(" • "))+'</div></div><div class="'+(m.winner_name?.toLowerCase()===name?"win":"loss")+'">'+esc(m.winner_name?.toLowerCase()===name?"WIN":m.winner_name?"LOSS":"—")+'</div></div>').join(""):'<div class="empty">No synchronized match history for this profile.</div>';
 const ch=await SB.from("cr_sports_championships").select("*").eq("organization",w.organization).or("champion_name.ilike.%"+w.name+"%,champion_slug.eq."+w.slug).order("won_at",{ascending:false}).limit(100);
 const titles=ch.error?[]:(ch.data||[]);document.getElementById("titlesN").textContent=titles.length;
 document.getElementById("titles").innerHTML=titles.length?titles.map(t=>'<div class="row"><div class="date">'+esc(date(t.won_at))+'</div><div><b>'+esc(t.title_name||t.title_type||"Championship")+'</b><div class="muted">'+esc(t.division||t.status||"")+'</div></div><div class="title">'+esc(t.status||"HISTORY")+'</div></div>').join(""):'<div class="empty">No championship records linked to this profile.</div>';
 const evIds=[...new Set(ms.map(m=>m.event_id).filter(Boolean))];let upcoming=[];
 if(evIds.length){const er=await SB.from("cr_sports_events").select("*").in("id",evIds);upcoming=(er.data||[]).filter(e=>new Date(e.starts_at)>new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))}
 document.getElementById("upcoming").innerHTML=upcoming.length?upcoming.map(e=>'<div class="row"><div class="date">'+esc(date(e.starts_at))+'</div><div><b>'+esc(e.title||"Event")+'</b><div class="muted">'+esc([e.venue,e.city].filter(Boolean).join(" • "))+'</div></div><div>'+esc(e.organization||w.organization)+'</div></div>').join(""):'<div class="empty">No upcoming appearances are linked to this wrestler yet.</div>';
 const gallery=[w.image_url,...(Array.isArray(payload.gallery_images)?payload.gallery_images:[]),payload.image_url].filter((x,i,a)=>x&&a.indexOf(x)===i);
 document.getElementById("gallery").innerHTML=gallery.length?gallery.map(x=>'<figure><img src="'+esc(x)+'" alt="'+esc(w.name)+'" loading="lazy"></figure>').join(""):'<div class="empty">No verified gallery images available.</div>';
 document.getElementById("sources").innerHTML='<p><b>Provider:</b> '+esc(w.provider||"—")+'<br><b>Provider ID:</b> '+esc(w.provider_id||"—")+'<br><b>Last provider update:</b> '+esc(w.provider_updated_at||"—")+'</p><a class="source" href="'+esc(source)+'" target="_blank" rel="noopener">OPEN OFFICIAL / SOURCE PROFILE</a>';
}
function fail(m){document.getElementById("profile").innerHTML='<div class="empty error">'+esc(m)+'</div>'}
boot();
</script><script>footer()</script></body></html>
