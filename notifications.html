<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Sports 12.0 | Notification Command Center</title><link rel="stylesheet" href="css/sports.css"></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script><script>shell('notifications');</script>
<main class="wrap" style="max-width:1100px;padding:70px 20px 100px">
<section class="hero"><div class="eyebrow">CROWRULES SPORTS 10.0</div><h1>NOTIFICATION CENTER</h1><p>Game Starting • Live • Score Change • Final</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="button" id="markAll">MARK ALL READ</button><button class="button" id="refresh">REFRESH</button></div></section>
<section style="margin-top:30px"><div id="state" class="notice">Connecting to your CrowRules Sports account…</div><div id="filters"><button data-f="all">ALL</button><button data-f="game_starting">STARTING</button><button data-f="game_live">LIVE</button><button data-f="game_score_change">SCORE</button><button data-f="game_final">FINAL</button></div><div id="list"></div><section><h2>FOLLOWED GAMES & ALERTS</h2><div id="followList" class="notice">Loading…</div></section></section>
</main><script>
const list=document.getElementById('list'),stateEl=document.getElementById('state'),followList=document.getElementById('followList'); let currentFilter='all',allRows=[],currentUser=null;
function escN(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){const d=new Date(v);return isNaN(d)?'':d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function icon(t){return t==='game_final'?'FINAL':t==='team_score'?'YOUR TEAM':(t==='game_score_change'||t==='game_event')?'SCORE':t==='game_live'?'LIVE':t==='game_starting'?'START':'SPORTS'}
function render(){const rows=currentFilter==='all'?allRows:allRows.filter(x=>currentFilter==='game_score_change'?(x.notification_type==='game_score_change'||x.notification_type==='team_score'||x.notification_type==='game_event'):x.notification_type===currentFilter);list.innerHTML=rows.length?rows.map(x=>'<article class="game-panel" style="margin:12px 0"><h3>'+escN(x.title)+'</h3><div class="muted">'+escN(x.body||'')+'</div><small class="muted">'+fmt(x.created_at)+'</small><div style="margin-top:10px">'+(!x.read_at?'<button class="button small" data-read="'+x.id+'">MARK READ</button>':'READ')+(x.entity_id?'<a class="button small" href="home.html?game='+encodeURIComponent(x.entity_id)+'">OPEN GAME</a>':'')+'</div></article>').join(''):'<div class="empty">No notifications in this filter.</div>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{await sb.from('cr_sports_user_notifications').update({read_at:new Date().toISOString()}).eq('id',b.dataset.read).eq('user_id',currentUser.id);load()})} async function loadFollows(){const r=await sb.from('cr_sports_user_followed_games').select('game_id,notify_start,notify_live,notify_score,notify_final,cr_sports_games(id,home:cr_sports_teams!cr_sports_games_home_team_id_fkey(name),away:cr_sports_teams!cr_sports_games_away_team_id_fkey(name))').eq('user_id',currentUser.id);if(r.error){followList.textContent=r.error.message;return}followList.innerHTML=(r.data||[]).map(x=>{const g=x.cr_sports_games||{};return '<div class="row"><strong>'+escN(g.away?.name||'Away')+' @ '+escN(g.home?.name||'Home')+'</strong> '+['start','live','score','final'].map(k=>'<label><input type="checkbox" data-pref="notify_'+k+'" data-game="'+x.game_id+'" '+(x['notify_'+k]?'checked':'')+'> '+k.toUpperCase()+'</label>').join(' ')+' <a href="home.html?game='+x.game_id+'">GAME CENTER</a></div>'}).join('')||'<div class="empty">No followed games.</div>';document.querySelectorAll('[data-pref]').forEach(e=>e.onchange=async()=>{const p={};p[e.dataset.pref]=e.checked;await sb.from('cr_sports_user_followed_games').update(p).eq('user_id',currentUser.id).eq('game_id',e.dataset.game)})} async function load(){
 const s=await sb.auth.getSession(),u=s.data.session?.user; currentUser=u;
 if(!u){stateEl.textContent='Sign in to view your account notifications.';list.innerHTML='<div class="empty">Your Sports notifications are tied to your CrowRules account.</div>';return}
 const r=await sb.from('cr_sports_user_notifications').select('id,notification_type,title,body,entity_type,entity_id,read_at,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(100);
 if(r.error){stateEl.textContent='Notification error: '+r.error.message;return}
 const rows=r.data||[];allRows=rows;const unread=rows.filter(x=>!x.read_at).length;stateEl.textContent=unread+' unread • '+rows.length+' recent notifications';render();loadFollows();
 list.innerHTML=rows.length?rows.map(x=>'<article class="game-panel" style="margin:12px 0;opacity:'+(x.read_at?'0.72':'1')+'"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><span class="tag '+(x.notification_type==='game_final'?'team':'')+'">'+icon(x.notification_type)+'</span><h3 style="margin:10px 0 5px">'+escN(x.title)+'</h3><div class="muted">'+escN(x.body||'')+'</div></div><small class="muted">'+fmt(x.created_at)+'</small></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+(!x.read_at?'<button class="button small" data-read="'+x.id+'">MARK READ</button>':'<span class="muted">READ</span>')+(x.entity_type==='game'&&x.entity_id?'<a class="button small" href="home.html?game='+encodeURIComponent(x.entity_id)+'">OPEN GAME</a>':'')+'</div></article>').join(''):'<div class="empty">No notifications yet. Follow a game from the Game Center and alerts will appear here.</div>';
 list.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{await sb.from('cr_sports_user_notifications').update({read_at:new Date().toISOString()}).eq('id',b.dataset.read).eq('user_id',u.id);loadUnread();load()});
}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.f;render()});document.getElementById('refresh').onclick=load;
document.getElementById('markAll').onclick=async()=>{const s=await sb.auth.getSession(),u=s.data.session?.user;if(!u)return;await sb.from('cr_sports_user_notifications').update({read_at:new Date().toISOString()}).eq('user_id',u.id).is('read_at',null);loadUnread();load()};
sb.auth.onAuthStateChange(()=>setTimeout(load,50));load();
</script><script>function loadUnread(){const el=document.querySelector('.navlinks a[href="notifications.html"]');if(!el)return;sb.auth.getSession().then(({data})=>{if(!data.session){el.textContent='NOTIFICATIONS';return}sb.from('cr_sports_user_notifications').select('id',{count:'exact',head:true}).eq('user_id',data.session.user.id).is('read_at',null).then(r=>el.textContent='NOTIFICATIONS'+(r.count?' ('+r.count+')':''))})}</script>
<script id="sportsNotifications12">(function(){
"use strict";
let nrt=null;
function renderRealtimeRow(x){
 const el=document.getElementById("list");if(!el)return;
 const a=document.createElement("article");a.className="game-panel";a.style.margin="12px 0";
 a.innerHTML='<div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><span class="tag">LIVE</span><h3 style="margin:10px 0 5px"></h3><div class="muted body"></div></div><small class="muted time"></small></div><div style="margin-top:12px"><a class="button small" href="'+(x.entity_id?'home.html?game='+encodeURIComponent(x.entity_id):'notifications.html')+'">'+(x.entity_id?'OPEN GAME':'OPEN ALERTS')+'</a></div>';
 a.querySelector("h3").textContent=x.title||"Sports Alert";a.querySelector(".body").textContent=x.body||"";a.querySelector(".time").textContent=fmt(x.created_at);
 el.prepend(a);
}
function startNotificationRealtime(){
 if(!currentUser)return;
 if(nrt)sb.removeChannel(nrt);
 nrt=sb.channel("sports-notifications-12")
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"cr_sports_user_notifications",filter:"user_id=eq."+currentUser.id},p=>{
   const x=p.new;if(!x)return;allRows=[x,...allRows].slice(0,100);renderRealtimeRow(x);stateEl.textContent="NEW ALERT • "+x.title;
   if(window.loadUnread)loadUnread();
 })
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"cr_sports_user_notifications",filter:"user_id=eq."+currentUser.id},p=>{if(p.new?.id)load()})
 .subscribe(s=>{if(s==="SUBSCRIBED")stateEl.textContent="● LIVE • Notifications updating in real time";});
}
const originalLoad=load;
load=async function(){await originalLoad();if(currentUser)startNotificationRealtime()};
setTimeout(()=>{if(currentUser)startNotificationRealtime()},1800);
})();</script></body></html>
