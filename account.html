<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Sports | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script><style>.wrap{max-width:1200px;margin:auto;padding:70px 22px}.hero{padding:35px;border:1px solid #272727;background:linear-gradient(135deg,#121214,#090909);margin-bottom:18px}.ey{font:800 10px Orbitron;letter-spacing:3px;color:#e10600}.hero h1{font:900 clamp(35px,6vw,70px) Orbitron;margin:8px 0}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{padding:22px;border:1px solid #272727;background:#0d0d0f}.card h2{font:900 18px Orbitron;margin:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #222;font-size:11px}.btn{border:1px solid #333;background:#121214;color:#eee;padding:8px 10px;cursor:pointer;font:800 9px Orbitron}.btn:hover{border-color:#e10600}.notice{padding:15px;border:1px dashed #333;color:#777;font-size:11px}.badge{display:inline-block;padding:4px 7px;border:1px solid #49302e;color:#e78b85;font-size:8px;letter-spacing:1px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><script>shell('account')</script><main class="wrap"><section class="hero"><div class="ey">CROWRULES SPORTS 4.0</div><h1>MY SPORTS</h1><p class="muted" id="identity">Checking your CrowRules account…</p></section><div id="message" class="notice">Loading your sports profile…</div><div class="grid" style="margin-top:15px"><section class="card"><h2>MY TEAMS</h2><div id="teams"><div class="muted">Loading…</div></div></section><section class="card"><h2>FOLLOWED LEAGUES</h2><div id="leagues"><div class="muted">Loading…</div></div></section><section class="card"><h2>FAVORITE PLAYERS</h2><div id="players"><div class="muted">Loading…</div></div></section><section class="card"><h2>PICK 'EM ACTIVITY</h2><div id="pickem"><div class="muted">Loading…</div></div></section><section class="card"><h2>NOTIFICATIONS</h2><div id="notifications"><div class="muted">Loading…</div></div></section><section class="card"><h2>PREFERENCES</h2><div class="row"><span>Sports notifications</span><button class="btn" id="notifBtn">Loading…</button></div></section></div></main><script>loadSession().then(async session=>{if(!session){document.querySelector('#identity').textContent='Sign in to your CrowRules account to save teams, leagues, players, Pick ’Em activity and notifications.';document.querySelector('#message').innerHTML='<a class="button active" href="login.html">SIGN IN / CREATE ACCOUNT</a>';['teams','leagues','players','pickem','notifications'].forEach(id=>document.getElementById(id).innerHTML='<div class="muted">Sign in required.</div>');return}const uid=session.user.id;document.querySelector('#identity').textContent=session.user.email||'CrowRules member';document.querySelector('#message').innerHTML='<span class="badge">ACCOUNT SYNC ACTIVE</span> Your sports preferences are saved to your CrowRules account.';async function load(){const [t,l,p,n,pref,pe]=await Promise.all([sb.from('cr_sports_user_favorite_teams').select('team_id,cr_sports_teams(name,short_name,city)').eq('user_id',uid),sb.from('cr_sports_user_followed_leagues').select('league_id,cr_sports_leagues(name,code)').eq('user_id',uid),sb.from('cr_sports_user_favorite_players').select('player_key,player_name').eq('user_id',uid),sb.from('cr_sports_notifications').select('id,title,body,read_at,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(8),sb.from('cr_sports_user_preferences').select('notification_enabled').eq('user_id',uid).maybeSingle(),sb.from('cr_sports_pickem_entries').select('id,week_id,points,submitted_at').eq('user_id',uid).order('submitted_at',{ascending:false}).limit(8)]);const rows=(data,empty,remove,fmt)=>data?.length?data.map(fmt).join(''):empty;document.getElementById('teams').innerHTML=rows(t.data,'<div class="muted">No favorite teams yet. Use ★ on the Sports home page.</div>',true,x=>`<div class="row"><span>${esc(x.cr_sports_teams?.name||x.team_id)}</span><button class="btn" data-remove-team="${x.team_id}">REMOVE</button></div>`);document.getElementById('leagues').innerHTML=rows(l.data,'<div class="muted">No followed leagues yet.</div>',true,x=>`<div class="row"><span>${esc(x.cr_sports_leagues?.name||x.league_id)}</span><button class="btn" data-remove-league="${x.league_id}">REMOVE</button></div>`);document.getElementById('players').innerHTML=rows(p.data,'<div class="muted">No favorite players yet.</div>',true,x=>`<div class="row"><span>${esc(x.player_name||x.player_key)}</span></div>`);document.getElementById('notifications').innerHTML=rows(n.data,'<div class="muted">No notifications.</div>',false,x=>`<div class="row"><span><strong>${esc(x.title)}</strong><br><span class="muted">${esc(x.body||'')}</span></span><span class="badge">${x.read_at?'READ':'NEW'}</span></div>`);document.getElementById('pickem').innerHTML=pe.data?.length?`<div class="row"><span>Entries</span><strong>${pe.data.length}</strong></div><div class="row"><span>Points</span><strong>${pe.data.reduce((a,x)=>a+(x.points||0),0)}</strong></div><div class="row"><span>Latest</span><span>${esc(pe.data[0]?.submitted_at||'')}</span></div>`:'<div class="muted">No Pick ’Em entries yet.</div>';const enabled=pref.data?.notification_enabled!==false;document.getElementById('notifBtn').textContent=enabled?'ON':'OFF';document.getElementById('notifBtn').onclick=async()=>{const v=!enabled;await sb.from('cr_sports_user_preferences').upsert({user_id:uid,notification_enabled:v},{onConflict:'user_id'});load()};document.querySelectorAll('[data-remove-team]').forEach(b=>b.onclick=async()=>{await sb.from('cr_sports_user_favorite_teams').delete().eq('user_id',uid).eq('team_id',b.dataset.removeTeam);load()});document.querySelectorAll('[data-remove-league]').forEach(b=>b.onclick=async()=>{await sb.from('cr_sports_user_followed_leagues').delete().eq('user_id',uid).eq('league_id',b.dataset.removeLeague);load()})}load()})</script><script>footer()</script></body></html>
