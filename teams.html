<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script></head><body><script>shell("teams")</script><section class="hero"><div class="eyebrow">TEAM DIRECTORY</div><h1>MAJOR <span>& MINOR</span></h1><p>Professional, college, minor-league and community teams.</p></section><section class="section"><div class="actions"><select id="level"><option value="">All levels</option><option>major</option><option>minor</option><option>college</option><option>amateur</option></select><input id="search" class="input" placeholder="Search teams…" style="max-width:300px"></div><div class="grid3" id="cards" style="margin-top:20px"></div></section><script>loadSession();let teams=[];function render(){let x=teams;if($("#level").value)x=x.filter(t=>t.level===$("#level").value);if($("#search").value)x=x.filter(t=>(t.name+" "+(t.city||"")).toLowerCase().includes($("#search").value.toLowerCase()));$("#cards").innerHTML=x.map(t=>'<div class="card"><span class="tag">'+esc(t.level.toUpperCase())+'</span><h3>'+esc(t.name)+'</h3><p class="muted">'+esc(t.city)+' '+esc(t.state)+' • '+esc(t.cr_sports_leagues?.code)+'</p></div>').join("")||'<div class="card">No teams match.</div>'}(async()=>{const{data}=await sb.from("cr_sports_teams").select("*,cr_sports_leagues(code,name)").order("name");teams=data||[];$("#level").onchange=render;$("#search").oninput=render;render()})()</script><script>footer()</script></body></html>
