<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CrowRules Sports Team Directory and Team Dashboard">
<title>Teams & Team Dashboard | CrowRules Sports</title>
<link rel="stylesheet" href="css/sports.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/sports.js?v=23.0"></script>
<style>
body{background:#050508}
.team-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 15%,#ff304f18,transparent 35%),linear-gradient(135deg,#07070b,#0c0c12);border-bottom:1px solid #ffffff0b}
.team-wrap{max-width:1500px;margin:auto;padding:30px 20px}.team-hero .team-wrap{padding:58px 20px 42px}
.kicker{font:700 10px Orbitron;letter-spacing:.2em;color:#ff6075}.team-hero h1{font:900 clamp(38px,6vw,78px)/.95 Orbitron;margin:12px 0}.team-hero p{max-width:900px;color:#a7afbf;line-height:1.7}
.directory-toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 210px 180px 180px auto;gap:9px;margin-bottom:12px}.directory-toolbar>*{min-height:44px;box-sizing:border-box}
.directory-summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.summary-pill{border:1px solid #ffffff10;background:#ffffff04;border-radius:999px;padding:8px 11px;color:#929caf;font:700 8px Orbitron}.summary-pill b{color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}.chip{border:1px solid #ffffff12;background:#ffffff05;color:#c8cfdb;border-radius:999px;padding:8px 12px;font:700 9px Orbitron;cursor:pointer}.chip.active{border-color:#ff304f66;background:#ff304f12;color:#fff}
.directory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.team-card{position:relative;border:1px solid #ffffff10;border-radius:17px;padding:18px;background:linear-gradient(145deg,#ffffff06,#ffffff02);transition:.2s}.team-card:hover{transform:translateY(-2px);border-color:#ff304f38}.team-card.favorite{border-color:#ff304f55;box-shadow:0 0 0 1px #ff304f14,0 10px 30px #000}
.team-card-head{display:flex;gap:12px;align-items:center}.team-logo{width:58px;height:58px;border-radius:12px;object-fit:contain;background:#ffffff08}.team-name{font:800 17px Montserrat}.team-sub{font-size:10px;color:#737d90;margin-top:4px}.team-meta{display:flex;gap:5px;flex-wrap:wrap;margin:13px 0}.tag{display:inline-block;padding:5px 7px;border:1px solid #ffffff12;border-radius:5px;font:700 8px Orbitron;color:#9da6b8}
.team-actions{display:flex;gap:7px}.mini{flex:1;text-align:center;text-decoration:none;border:1px solid #ffffff12;background:#ffffff05;color:#dce1eb;padding:9px 7px;border-radius:8px;font:700 9px Orbitron;cursor:pointer}.mini:hover{border-color:#ff304f55}.star{position:absolute;right:15px;top:15px;width:30px;height:30px;border:1px solid #ffffff12;background:#ffffff05;color:#7e8798;border-radius:8px;cursor:pointer}.star.on{color:#ffd35a;border-color:#ffd35a44;background:#ffd35a0b}
.empty,.loading{padding:30px;text-align:center;color:#7d8799}.error{padding:18px;border:1px solid #ff304f33;background:#ff304f0a;border-radius:14px;color:#ff9aaa}
.dash{display:none}.dash.show{display:block}.back{margin-bottom:15px}.dash-hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;border:1px solid #ffffff10;border-radius:20px;padding:22px;background:radial-gradient(circle at 80% 20%,#ff304f12,transparent 35%),#0a0a0e}.dash-logo{width:96px;height:96px;object-fit:contain;border-radius:18px;background:#ffffff08}.dash-title{font:900 clamp(25px,4vw,44px) Orbitron}.dash-sub{color:#7f899d;font-size:11px;margin-top:7px}.dash-actions{display:flex;gap:7px;flex-wrap:wrap}.dash-actions .mini{flex:0 0 auto}.live-strip{margin:12px 0;border:1px solid #ff304f44;background:#ff304f0b;border-radius:12px;padding:11px;color:#ff9aaa;font:800 9px Orbitron}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff304f;margin-right:7px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:15px 0}.stat{border:1px solid #ffffff0e;border-radius:14px;padding:13px;background:#ffffff03}.stat b{display:block;font:800 20px Orbitron}.stat span{font-size:8px;color:#788296;letter-spacing:.08em}
.form{display:flex;gap:5px}.form i{font-style:normal;font:800 9px Orbitron;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:#ffffff08;color:#aab3c3}.form i.w{color:#65e6a1;background:#65e6a10d}.form i.l{color:#ff7186;background:#ff71860d}.form i.t{color:#ffd36b;background:#ffd36b0d}
.dash-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.panel{border:1px solid #ffffff10;border-radius:17px;background:#0a0a0e;padding:18px}.panel h2{font:800 16px Orbitron;margin:0 0 13px}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:26px 0 12px}.section-title h2{font:800 20px Orbitron;margin:0}.section-title a{font:700 9px Orbitron;color:#aab2c2;text-decoration:none}
.game-card{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff09;color:#fff;text-decoration:none}.game-card:last-child{border-bottom:0}.game-card:hover .game-title{color:#ff7186}.game-main{display:flex;gap:11px;min-width:0}.opp-logo{width:38px;height:38px;border-radius:9px;object-fit:contain;background:#ffffff08;flex:0 0 auto}.game-kicker{font:700 7px Orbitron;color:#687285;letter-spacing:.08em}.game-title{font:800 13px Montserrat;margin:3px 0}.game-meta{font-size:8px;color:#687285;white-space:normal}.game-score{font:800 14px Orbitron;text-align:right;white-space:nowrap}.live-label,.win-label{color:#65e6a1}.loss-label{color:#ff7186}
.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:9px;border-bottom:1px solid #ffffff08;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{font:700 8px Orbitron;color:#727c8e}.stand-rank{font:800 11px Orbitron}.note{font-size:9px;color:#626c7f;line-height:1.6;margin-top:12px}
@media(max-width:1150px){.directory-toolbar{grid-template-columns:1fr 1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.dash-grid{grid-template-columns:1fr}.dash-hero{grid-template-columns:auto 1fr}.dash-actions{grid-column:1/-1}}@media(max-width:650px){.team-wrap{padding:24px 12px}.team-hero .team-wrap{padding:42px 12px 30px}.directory-toolbar{grid-template-columns:1fr}.dash-hero{grid-template-columns:auto 1fr}.dash-logo{width:70px;height:70px}.stats{grid-template-columns:1fr 1fr}.team-name{font-size:15px}}
</style>
</head>
<body>
<script>shell("teams")</script>

<section class="team-hero">
 <div class="team-wrap">
  <div class="kicker">CROWRULES SPORTS • TEAM UNIVERSE</div>
  <h1>TEAMS</h1>
  <p>Find a team, open its complete dashboard, review its current standings, recent results and upcoming schedule, then jump directly into the CrowRules Event Center.</p>
 </div>
</section>

<main class="team-wrap">
 <div id="directory">
  <div class="directory-toolbar">
   <input id="search" class="input" placeholder="Search teams, cities, states, leagues or divisions…" aria-label="Search teams">
   <select id="league" class="input"><option value="">All leagues</option></select>
   <select id="level" class="input"><option value="">All levels</option></select>
   <select id="sort" class="input" aria-label="Sort teams"><option value="name">Sort: Team</option><option value="city">Sort: City</option><option value="league">Sort: League</option><option value="favorite">Sort: Favorites</option></select>
   <button id="refresh" class="btn">REFRESH</button>
  </div>
  <div class="directory-summary" id="summary"></div>
  <div class="chips" id="sports"></div>
  <div id="directoryStatus" class="loading">Loading teams…</div>
  <div class="directory-grid" id="cards"></div>
 </div>
 <section class="dash" id="dashboard">
  <button class="mini back" id="back">← BACK TO TEAMS</button>
  <div id="dashMount"></div>
 </section>
</main>

<script>
loadSession();
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>Number(v??0)||0;
const fmt=v=>v?new Date(v).toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}):"TBD";
const status=v=>String(v||"scheduled").toLowerCase();
let teams=[],leagues=[],sport="all",favorites=new Set(JSON.parse(localStorage.getItem("cr_team_favorites")||"[]"));

function leagueOf(t){return t.cr_sports_leagues||{}}
function saveFav(){localStorage.setItem("cr_team_favorites",JSON.stringify([...favorites]))}
function logo(t,cls="team-logo"){return t.logo_url?'<img class="'+cls+'" src="'+esc(t.logo_url)+'" alt="'+esc(t.short_name||t.name||"Team")+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="'+cls+'"></div>'}
function setLeagueFromGlobal(value){const wanted=String(value||"all").toLowerCase();const found=leagues.find(l=>String(l.code||"").toLowerCase()===wanted||String(l.id||"").toLowerCase()===wanted||String(l.name||"").toLowerCase()===wanted);$("league").value=found?.id||""}
function openDash(id){history.pushState({team:id},"","teams.html?id="+encodeURIComponent(id));$("directory").style.display="none";$("dashboard").classList.add("show");loadDashboard(id)}
function closeDash(push=true){if(push)history.pushState({},"","teams.html");$("dashboard").classList.remove("show");$("directory").style.display="block"}
function renderSports(){const ss=[...new Set(leagues.map(x=>x.sport).filter(Boolean))].sort();$("sports").innerHTML='<button class="chip '+(sport==="all"?"active":"")+'" data-s="all">ALL SPORTS</button>'+ss.map(s=>'<button class="chip '+(sport===s?"active":"")+'" data-s="'+esc(s)+'">'+esc(String(s).toUpperCase())+'</button>').join("");$("sports").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sport=b.dataset.s;renderSports();renderDirectory()})}
function renderSummary(filtered){const active=teams.filter(t=>t.is_active!==false);const sports=new Set(active.map(t=>leagueOf(t).sport).filter(Boolean));const ls=new Set(active.map(t=>t.league_id).filter(Boolean));$("summary").innerHTML='<span class="summary-pill"><b>'+active.length+'</b> ACTIVE TEAMS</span><span class="summary-pill"><b>'+ls.size+'</b> LEAGUES</span><span class="summary-pill"><b>'+sports.size+'</b> SPORTS</span><span class="summary-pill"><b>'+filtered.length+'</b> SHOWN</span><span class="summary-pill"><b>'+favorites.size+'</b> FAVORITES</span>'}
function renderDirectory(){
 const q=$("search").value.trim().toLowerCase(),lid=$("league").value,level=$("level").value,sort=$("sort").value;
 let a=teams.filter(t=>{const l=leagueOf(t),hay=[t.name,t.short_name,t.city,t.state,t.division,l.name,l.code,l.sport,t.level].filter(Boolean).join(" ").toLowerCase();return (!q||hay.includes(q))&&(!lid||t.league_id===lid)&&(!level||t.level===level)&&(sport==="all"||String(l.sport||"").toLowerCase()===String(sport).toLowerCase())});
 a.sort((x,y)=>sort==="city"?String(x.city||"").localeCompare(String(y.city||"")):sort==="league"?String(leagueOf(x).name||"").localeCompare(String(leagueOf(y).name||"")):sort==="favorite"?Number(favorites.has(y.id))-Number(favorites.has(x.id))||String(x.name).localeCompare(String(y.name)):String(x.name||"").localeCompare(String(y.name||"")));
 renderSummary(a);$("directoryStatus").textContent=a.length?a.length+" team"+(a.length===1?"":"s")+" found":"No teams match the current filters.";
 $("cards").innerHTML=a.map(t=>'<article class="team-card '+(favorites.has(t.id)?"favorite":"")+'"><button class="star '+(favorites.has(t.id)?"on":"")+'" title="Favorite team" aria-label="Favorite '+esc(t.name)+'" data-fav="'+esc(t.id)+'">★</button><div class="team-card-head">'+logo(t)+'<div><div class="team-name">'+esc(t.short_name||t.name)+'</div><div class="team-sub">'+esc([t.city,t.state].filter(Boolean).join(", ")||"Location not listed")+'</div></div></div><div class="team-meta"><span class="tag">'+esc(leagueOf(t).code||"LEAGUE")+'</span><span class="tag">'+esc((t.level||"TEAM").toUpperCase())+'</span>'+(t.division?'<span class="tag">'+esc(t.division)+'</span>':"")+'</div><div class="team-actions"><button class="mini open-team" data-id="'+esc(t.id)+'">TEAM HUB</button><a class="mini" href="standings.html?league='+encodeURIComponent(t.league_id||"")+'&team='+encodeURIComponent(t.id||"")+'">STANDINGS</a></div></article>').join("")||'<div class="empty">No teams match. Try another sport, league, level or search.</div>';
 $("cards").querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const id=b.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);saveFav();renderDirectory()});
 $("cards").querySelectorAll(".open-team").forEach(b=>b.onclick=()=>openDash(b.dataset.id))
}
async function fetchAll(table,select,filter){const pageSize=500;let out=[],from=0;while(true){let q=sb.from(table).select(select).range(from,from+pageSize-1);if(filter)q=filter(q);const r=await q;if(r.error)throw r.error;out.push(...(r.data||[]));if((r.data||[]).length<pageSize)break;from+=pageSize;if(from>10000)break}return out}
async function loadDirectory(){
 $("directoryStatus").textContent="Loading teams…";
 try{
  const [tdata,ldata]=await Promise.all([
   fetchAll("cr_sports_teams","id,league_id,name,short_name,city,state,division,level,logo_url,is_active,cr_sports_leagues(id,name,code,sport)",q=>q.eq("is_active",true).order("name")),
   fetchAll("cr_sports_leagues","id,name,code,sport,is_active",q=>q.eq("is_active",true).order("name"))
  ]);
  teams=tdata;leagues=ldata;
  $("league").innerHTML='<option value="">All leagues</option>'+leagues.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.code||l.name)+' — '+esc(l.name)+'</option>').join("");
  $("level").innerHTML='<option value="">All levels</option>'+[...new Set(teams.map(t=>t.level).filter(Boolean))].sort().map(x=>'<option value="'+esc(x)+'">'+esc(String(x).toUpperCase())+'</option>').join("");
  setLeagueFromGlobal(localStorage.getItem("cr_sports_league")||"all");renderSports();renderDirectory()
 }catch(e){$("directoryStatus").innerHTML='<div class="error">Teams could not be loaded.<br><small>'+esc(e.message||e)+'</small></div>'}
}
function resultLetter(g,id){const home=g.home_team_id===id,me=home?n(g.home_score):n(g.away_score),opp=home?n(g.away_score):n(g.home_score);return me>opp?"W":me<opp?"L":"T"}
function record(x){return n(x.wins)+"-"+n(x.losses)+(n(x.ties)?"-"+n(x.ties):"")}
function pct(v){const x=n(v);return (x<=1?x*100:x).toFixed(1)+"%"}
function stat(v,k){return '<div class="stat"><b>'+esc(v)+'</b><span>'+k+'</span></div>'}
function gameCard(g,id){const home=g.home_team_id===id,opp=home?g.away:g.home,s=status(g.status),live=["live","in_progress","inprogress","playing","active"].includes(s),final=["final","completed","complete","closed"].includes(s),me=home?n(g.home_score):n(g.away_score),os=home?n(g.away_score):n(g.home_score),label=live?"LIVE":final?(me>os?"WIN":me<os?"LOSS":"TIE"):fmt(g.starts_at);return '<a class="game-card '+(live?"live":"")+'" href="event.html?id='+encodeURIComponent(g.id)+'"><div class="game-main">'+(opp?.logo_url?'<img class="opp-logo" src="'+esc(opp.logo_url)+'" alt="" loading="lazy">':'<div class="opp-logo"></div>')+'<div><div class="game-kicker">'+(home?"VS":"AT")+' • '+esc(g.cr_sports_leagues?.code||"GAME")+'</div><div class="game-title">'+esc(opp?.short_name||opp?.name||"Opponent")+'</div><div class="game-meta">'+fmt(g.starts_at)+' • '+esc(g.venue||"Venue TBD")+(g.broadcast?" • "+esc(g.broadcast):"")+'</div></div></div><div class="game-score '+(live?"live-label":final?(me>os?"win-label":me<os?"loss-label":""):"")+'">'+(live||final?me+"-"+os:label)+'<div class="game-kicker">'+esc(label)+'</div></div></a>'}
async function loadDashboard(id){
 const mount=$("dashMount");mount.innerHTML='<div class="loading">Loading team hub…</div>';
 try{
  const {data:t,error:te}=await sb.from("cr_sports_teams").select("id,league_id,name,short_name,city,state,division,level,logo_url,is_active,cr_sports_leagues(id,name,code,sport)").eq("id",id).maybeSingle();if(te||!t)throw te||new Error("Team not found");
  const [st,ga]=await Promise.all([
   sb.from("cr_sports_standings").select("*").eq("team_id",id).order("season",{ascending:false}).limit(25),
   sb.from("cr_sports_games").select("id,league_id,home_team_id,away_team_id,starts_at,status,home_score,away_score,venue,broadcast,home:cr_sports_teams!cr_sports_games_home_team_id_fkey(id,name,short_name,logo_url),away:cr_sports_teams!cr_sports_games_away_team_id_fkey(id,name,short_name,logo_url),cr_sports_leagues(code,name)").or("home_team_id.eq."+id+",away_team_id.eq."+id).order("starts_at",{ascending:false}).limit(200)
  ]);
  if(st.error)throw st.error;if(ga.error)throw ga.error;
  const standings=st.data||[],allGames=ga.data||[],now=Date.now(),current=standings[0]||null,l=t.cr_sports_leagues||{};
  const final=s=>["final","completed","complete","closed"].includes(status(s)),live=s=>["live","in_progress","inprogress","playing","active"].includes(status(s));
  const liveGames=allGames.filter(g=>live(g.status)),recent=allGames.filter(g=>new Date(g.starts_at||0).getTime()<=now&&!live(g.status)).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)).slice(0,10),upcoming=allGames.filter(g=>new Date(g.starts_at||0).getTime()>now&&!live(g.status)).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  const form=recent.filter(g=>final(g.status)).slice(0,5).map(g=>resultLetter(g,id));
  const diff=current?n(current.points_for)-n(current.points_against):null;
  mount.innerHTML='<div class="dash-hero">'+logo(t,"dash-logo")+'<div><div class="kicker">'+esc(l.code||"SPORTS")+' • TEAM HUB</div><div class="dash-title">'+esc(t.name||t.short_name)+'</div><div class="dash-sub">'+esc([t.city,t.state].filter(Boolean).join(", ")||"Location not listed")+' • '+esc(l.name||"League")+' • '+esc(t.division||t.level||"Team")+'</div></div><div class="dash-actions"><button class="mini" id="favDash">'+(favorites.has(t.id)?"★ FAVORITED":"☆ FAVORITE")+'</button><button class="mini" id="shareDash">SHARE</button><a class="mini" href="standings.html?league='+encodeURIComponent(t.league_id)+'&team='+encodeURIComponent(t.id)+'">STANDINGS</a><a class="mini" href="scores.html">SCORES</a></div></div>'+(liveGames.length?'<div class="live-strip"><span class="live-dot"></span>'+liveGames.length+' LIVE GAME'+(liveGames.length>1?"S":"")+' NOW • OPEN EVENT CENTER</div>':"")+'<div class="stats">'+stat(current?record(current):"—","RECORD")+stat(current?pct(current.win_pct):"—","WIN %")+stat(current?(current.rank??"—"):"—","RANK")+stat(current?n(current.points_for):"—","POINTS FOR")+stat(current?n(current.points_against):"—","POINTS AGAINST")+stat(current&&diff!==null?(diff>0?"+":"")+diff:"—","DIFF")+'</div><div class="panel"><div class="section-title"><h2>RECENT FORM</h2><span class="form">'+(form.length?form:["—"]).map(x=>'<i class="'+(x==="W"?"w":x==="L"?"l":"t")+'">'+x+'</i>').join("")+'</span></div></div><div class="dash-grid"><div class="panel"><h2>LIVE & RECENT GAMES</h2>'+(liveGames.concat(recent).slice(0,10).map(g=>gameCard(g,id)).join("")||'<div class="empty">No games found.</div>')+'</div><div class="panel"><h2>UPCOMING SCHEDULE</h2>'+(upcoming.slice(0,10).map(g=>gameCard(g,id)).join("")||'<div class="empty">No upcoming games found.</div>')+'</div></div><div class="section-title"><h2>FULL SEASON SCHEDULE</h2><a href="scores.html">OPEN SCORES →</a></div><div class="panel">'+(upcoming.concat(recent).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).map(g=>gameCard(g,id)).join("")||'<div class="empty">No scheduled games available.</div>')+'</div><div class="section-title"><h2>STANDINGS HISTORY</h2><a href="standings.html?league='+encodeURIComponent(t.league_id)+'&team='+encodeURIComponent(t.id)+'">OPEN STANDINGS →</a></div><div class="panel"><table class="table"><thead><tr><th>SEASON</th><th>RK</th><th>RECORD</th><th>WIN%</th><th>PF</th><th>PA</th><th>DIFF</th><th>STREAK</th></tr></thead><tbody>'+standings.map(x=>'<tr><td>'+esc(x.season)+'</td><td class="stand-rank">'+esc(x.rank??"—")+'</td><td>'+record(x)+'</td><td>'+pct(x.win_pct)+'</td><td>'+n(x.points_for)+'</td><td>'+n(x.points_against)+'</td><td>'+((n(x.points_for)-n(x.points_against)>0?"+":""))+(n(x.points_for)-n(x.points_against))+'</td><td>'+((n(x.streak)>0?"+":""))+n(x.streak)+'</td></tr>').join("")+'</tbody></table></div>';
  $("favDash").onclick=()=>{favorites.has(t.id)?favorites.delete(t.id):favorites.add(t.id);saveFav();loadDashboard(id)};
  $("shareDash").onclick=async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);$("shareDash").textContent="COPIED";setTimeout(()=>$("shareDash").textContent="SHARE",1500)}catch(_){window.prompt("Copy team link:",url)}};
 }catch(e){mount.innerHTML='<div class="error">Team hub could not be loaded.<br><small>'+esc(e.message||e)+'</small></div>'}
}
$("search").oninput=renderDirectory;$("league").onchange=renderDirectory;$("level").onchange=renderDirectory;$("sort").onchange=renderDirectory;$("refresh").onclick=loadDirectory;$("back").onclick=()=>closeDash();
document.addEventListener("crowrules:leaguechange",e=>{setLeagueFromGlobal(e.detail?.league||"all");renderDirectory()});
