<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scores | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js?v=17.1"></script></head><body><script>shell("schedule")</script><section class="hero"><div class="eyebrow">GAME CENTER</div><h1>SCORES <span>&</span> SCHEDULE</h1><p>Live, scheduled and final games from the CrowRules Sports database.</p></section><section class="section"><div class="table-wrap"><table><thead><tr><th>TIME</th><th>LEAGUE</th><th>AWAY</th><th>SCORE</th><th>HOME</th><th>STATUS</th><th>VENUE</th></tr></thead><tbody id="games"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">SPORTS 21.0</div><h2>EVENT SCHEDULE</h2></div></div><div class="table-wrap"><table><thead><tr><th>TIME</th><th>LEAGUE</th><th>EVENT</th><th>TYPE</th><th>STATUS</th><th>VENUE</th><th>FOLLOW</th></tr></thead><tbody id="events21"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section><script>loadSession();(async()=>{const{data,error}=await sb.from("cr_sports_games").select("*,cr_sports_leagues(name),home:cr_sports_teams!cr_sports_games_home_team_id_fkey(name),away:cr_sports_teams!cr_sports_games_away_team_id_fkey(name)").order("starts_at").limit(100);$("#games").innerHTML=error?'<tr><td colspan="7">'+esc(error.message)+'</td></tr>':data?.length?data.map(g=>'<tr><td>'+new Date(g.starts_at).toLocaleString()+'</td><td>'+esc(g.cr_sports_leagues?.name)+'</td><td>'+esc(g.away?.name)+'</td><td>'+(g.away_score??"-")+' — '+(g.home_score??"-")+'</td><td>'+esc(g.home?.name)+'</td><td><span class="tag">'+esc(g.status.toUpperCase())+'</span></td><td>'+esc(g.venue)+'</td></tr>').join(""):'<tr><td colspan="7">No games are loaded yet.</td></tr>'})()const ev=await sb.from("cr_sports_events").select("id,title,event_type,status,starts_at,venue,city,cr_sports_leagues(code,name)").order("starts_at").limit(100);document.getElementById("events21").innerHTML=ev.error?'<tr><td colspan="7">'+esc(ev.error.message)+'</td></tr>':(ev.data||[]).map(e=>'<tr><td>'+new Date(e.starts_at).toLocaleString()+'</td><td>'+esc(e.cr_sports_leagues?.name)+'</td><td><strong>'+esc(e.title)+'</strong></td><td>'+esc(e.event_type||"EVENT")+'</td><td><span class="tag">'+esc(String(e.status||"scheduled").toUpperCase())+'</span></td><td>'+esc((e.venue||"")+(e.city?" • "+e.city:""))+'</td><td><button class="button small eventFollow21" data-id="'+e.id+'">FOLLOW</button></td></tr>').join("")||'<tr><td colspan="7">No events are loaded yet.</td></tr>';const ss=await sb.auth.getSession();if(ss.data.session){const uid=ss.data.session.user.id;const ff=await sb.from("cr_sports_user_followed_events").select("event_id").eq("user_id",uid);const set=new Set((ff.data||[]).map(x=>x.event_id));document.querySelectorAll(".eventFollow21").forEach(b=>{if(set.has(b.dataset.id))b.textContent="FOLLOWING";b.onclick=async()=>{if(set.has(b.dataset.id)){await sb.from("cr_sports_user_followed_events").delete().eq("user_id",uid).eq("event_id",b.dataset.id);set.delete(b.dataset.id);b.textContent="FOLLOW"}else{await sb.from("cr_sports_user_followed_events").upsert({user_id:uid,event_id:b.dataset.id});set.add(b.dataset.id);b.textContent="FOLLOWING"}}})}</script><script>footer()</script></body></html>
