<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scores | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script></head><body><script>shell("schedule")</script><section class="hero"><div class="eyebrow">GAME CENTER</div><h1>SCORES <span>&</span> SCHEDULE</h1><p>Live, scheduled and final games from the CrowRules Sports database.</p></section><section class="section"><div class="table-wrap"><table><thead><tr><th>TIME</th><th>LEAGUE</th><th>AWAY</th><th>SCORE</th><th>HOME</th><th>STATUS</th><th>VENUE</th></tr></thead><tbody id="games"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section><script>loadSession();(async()=>{const{data,error}=await sb.from("cr_sports_games").select("*,cr_sports_leagues(name),home:cr_sports_teams!cr_sports_games_home_team_id_fkey(name),away:cr_sports_teams!cr_sports_games_away_team_id_fkey(name)").order("starts_at").limit(100);$("#games").innerHTML=error?'<tr><td colspan="7">'+esc(error.message)+'</td></tr>':data?.length?data.map(g=>'<tr><td>'+new Date(g.starts_at).toLocaleString()+'</td><td>'+esc(g.cr_sports_leagues?.name)+'</td><td>'+esc(g.away?.name)+'</td><td>'+(g.away_score??"-")+' — '+(g.home_score??"-")+'</td><td>'+esc(g.home?.name)+'</td><td><span class="tag">'+esc(g.status.toUpperCase())+'</span></td><td>'+esc(g.venue)+'</td></tr>').join(""):'<tr><td colspan="7">No games are loaded yet.</td></tr>'})()</script><script>footer()</script></body></html>
