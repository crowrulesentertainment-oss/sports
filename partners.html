<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partners | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script></head><body><script>shell("partners")</script><section class="hero"><div class="eyebrow">BUILD THE SPORTS UNIVERSE</div><h1>PARTNERS <span>& SPONSORS</span></h1><p>Businesses, organizations, media partners and community sponsors can help shape CrowRules Sports.</p></section><section class="section"><div class="grid" id="tiers"></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">START A CONVERSATION</div><h2>PARTNERSHIP INQUIRY</h2></div></div><form class="form" id="form"><input class="input" name="organization" placeholder="Organization" required><input class="input" name="contact_name" placeholder="Contact name" required><input class="input" name="email" type="email" placeholder="Email" required><select name="interest"><option>sponsorship</option><option>partnership</option><option>advertising</option><option>media</option><option>community</option></select><textarea name="message" placeholder="Tell us what you would like to build." required></textarea><button class="btn primary">SEND INQUIRY</button><div id="msg" class="muted"></div></form></section><script>loadSession();(async()=>{const{data}=await sb.from("cr_sports_partnerships").select("*").order("sort_order");$("#tiers").innerHTML=(data||[]).map(t=>'<div class="card"><span class="tag">'+esc(t.tier)+'</span><h3>'+esc(t.name)+'</h3><div class="kpi">'+esc(t.price_text)+'</div><p class="muted">'+esc(t.description)+'</p><ul>'+((t.benefits||[]).map(b=>'<li>'+esc(b)+'</li>').join(""))+'</ul></div>').join("")})();$("#form").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const{error}=await sb.from("cr_sports_partnership_inquiries").insert(o);$("#msg").textContent=error?error.message:"Thank you — your inquiry has been received.";if(!error)e.target.reset()}</script><script>footer()</script></body></html>
