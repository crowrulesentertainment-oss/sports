<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick Em | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script></head><body><script>shell("pickem")</script><section class="hero"><div class="eyebrow">COMMUNITY PREDICTIONS</div><h1>PICK 'EM <span>CHALLENGE</span></h1><p>Sign in with your CrowRules account to submit picks.</p></section><section class="section"><div class="grid3"><div class="card"><h3>SIGN IN</h3><input id="email" class="input" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><div class="actions"><button class="btn primary" onclick="signIn()">SIGN IN</button><button class="btn" onclick="signUp()">CREATE ACCOUNT</button></div></div><div class="card"><h3>SELECT A WEEK</h3><select id="week"></select><p class="muted">Challenges load from Supabase.</p></div><div class="card"><h3>SUBMIT PICKS</h3><textarea id="picks" placeholder='{"game_1":"SEA","game_2":"TAC"}'></textarea><button class="btn primary" onclick="submitPick()">SUBMIT</button><div id="result" class="muted"></div></div></div></section><script>loadSession();(async()=>{const{data}=await sb.from("cr_sports_pickem_weeks").select("*").eq("is_open",true).order("opens_at",{ascending:false});$("#week").innerHTML=(data||[]).map(w=>'<option value="'+w.id+'">'+esc(w.title)+' • '+esc(w.week_label)+'</option>').join("")||'<option>No open challenges</option>'})();async function submitPick(){const session=await loadSession();if(!session)return alert("Sign in first.");let picks;try{picks=JSON.parse($("#picks").value)}catch(e){return alert("Picks must be valid JSON.");}const{error}=await sb.from("cr_sports_pickem_entries").upsert({week_id:$("#week").value,user_id:session.user.id,picks},{onConflict:"week_id,user_id"});$("#result").textContent=error?error.message:"Picks submitted successfully."}</script><script>footer()</script></body></html>
