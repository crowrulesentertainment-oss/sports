<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaders | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js?v=23.0"></script></head><body><script>shell("leaders")</script><section class="hero"><div class="eyebrow">PLAYER DATA</div><h1>LEAGUE <span>LEADERS</span></h1><p>Top performers by category, season and league.</p></section><section class="section"><div class="actions"><select id="league"></select><select id="category"><option value="">All categories</option></select></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>CATEGORY</th><th>PLAYER</th><th>TEAM</th><th>VALUE</th><th>UNIT</th><th>SEASON</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>loadSession();let all=[];function render(){let x=all;if($("#league").value)x=x.filter(a=>a.league_id===$("#league").value);if($("#category").value)x=x.filter(a=>a.category===$("#category").value);$("#rows").innerHTML=x.length?x.map(a=>'<tr><td>'+esc(a.category)+'</td><td>'+esc(a.player_name)+'</td><td>'+esc(a.team_name)+'</td><td><strong>'+a.value+'</strong></td><td>'+esc(a.unit)+'</td><td>'+esc(a.season)+'</td></tr>').join(""):'<tr><td colspan="6">No leaders loaded yet.</td></tr>'}(async()=>{const[{data:ls},{data:le}]=await Promise.all([sb.from("cr_sports_leagues").select("id,name,code").order("name"),sb.from("cr_sports_leaders").select("*").order("value",{ascending:false}).limit(500)]);all=le||[];$("#league").innerHTML='<option value="">All leagues</option>'+(ls||[]).map(x=>'<option value="'+x.id+'">'+esc(x.code)+'</option>').join("");[...new Set(all.map(x=>x.category))].forEach(c=>$("#category").insertAdjacentHTML("beforeend",'<option>'+esc(c)+'</option>'));$("#league").onchange=render;$("#category").onchange=render;render()})()</script><script>footer()</script></body></html>
