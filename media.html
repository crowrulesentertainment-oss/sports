<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio & Video | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script></head><body><script>shell("media")</script><section class="hero"><div class="eyebrow">CROWRULES SPORTS MEDIA</div><h1>AUDIO <span>& VIDEO</span></h1><p>Original sports stories, interviews, commentary, highlights and community programming.</p></section><section class="section"><div class="grid3" id="media"></div></section><script>loadSession();(async()=>{const{data,error}=await sb.from("cr_sports_media").select("*").order("published_at",{ascending:false});$("#media").innerHTML=error?'<div class="card">'+esc(error.message)+'</div>':data?.length?data.map(x=>'<article class="card media-card"><div class="thumb">'+(x.media_type==="video"?"▶ VIDEO":"◉ AUDIO")+'</div><div class="media-body"><span class="tag">'+esc(x.media_type.toUpperCase())+'</span><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description)+'</p><a class="btn" href="'+esc(x.media_url)+'" target="_blank">OPEN MEDIA</a></div></article>').join(""):'<div class="card"><h3>Media center ready.</h3><p class="muted">Add published audio/video records in Supabase and they appear here automatically.</p></div>'})()</script><script>footer()</script></body></html>
