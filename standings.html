<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script><style>
.toolbar{display:flex;gap:12px;flex-wrap:wrap}.toolbar>*{min-height:44px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:7px 11px;border:1px solid #ffffff18;border-radius:999px;font-size:11px;background:#ffffff06}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.card{border:1px solid #ffffff12;border-radius:18px;overflow:hidden;background:#ffffff03}.head{padding:15px 17px;border-bottom:1px solid #ffffff10;display:flex;justify-content:space-between}.head h3{margin:0}.head small,.sub{opacity:.55}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #ffffff08;text-align:right}.table th:first-child,.table td:first-child,.table th:nth-child(2),.table td:nth-child(2){text-align:left}.team{font-weight:700}.sub{font-size:10px}.detail{display:block;font-size:9px;opacity:.58;text-align:left;padding:0 8px 8px 34px}.pos{color:#67f5a4}.neg{color:#ff7373}.status{font-size:12px;opacity:.65;margin:10px 0 16px}.empty{padding:30px;text-align:center;opacity:.6}
</style></head><body><script>shell("standings")</script>
<section class="hero"><div class="eyebrow">CROWRULES SPORTS • SPORTSDATAIO</div><h1>STANDINGS</h1><p>Conference, division, record and playoff intelligence from the normalized CrowRules sports feed.</p></section>
<section class="section"><div class="toolbar"><select id="league"></select><input class="input" id="season" value="2026" maxlength="4" style="max-width:140px"><select id="conference"><option value="">All conferences</option></select><select id="division"><option value="">All divisions</option></select><button class="btn" id="refresh">REFRESH</button></div><div class="meta" id="meta"></div><div class="status" id="status">Loading standings…</div><div class="grid" id="groups"></div></section>
<script>
loadSession();
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), N=v=>Number(v??0);
let rows=[];
function record(r){return N(r.wins)+"-"+N(r.losses)+(N(r.ties)?"-"+N(r.ties):"")}
async function leagues(){const{data,error}=await sb.from("cr_sports_leagues").select("id,name,code").eq("is_active",true).order("name");if(error)return $("#status").textContent=error.message;$("#league").innerHTML='<option value="">All leagues</option>'+(data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.code)+' — '+esc(x.name)+'</option>').join("");const nfl=(data||[]).find(x=>x.code==="NFL");if(nfl)$("#league").value=nfl.id}
function filters(){const cs=[...new Set(rows.map(x=>x.conference).filter(Boolean))].sort(),ds=[...new Set(rows.map(x=>x.division).filter(Boolean))].sort();const c=$("#conference").value,d=$("#division").value;$("#conference").innerHTML='<option value="">All conferences</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join("");$("#division").innerHTML='<option value="">All divisions</option>'+ds.map(x=>'<option>'+esc(x)+'</option>').join("");$("#conference").value=cs.includes(c)?c:"";$("#division").value=ds.includes(d)?d:""}
function render(){const c=$("#conference").value,d=$("#division").value,filtered=rows.filter(x=>(!c||x.conference===c)&&(!d||x.division===d)),groups={};filtered.forEach(x=>{const k=(x.conference||"LEAGUE")+" • "+(x.division||"TABLE");(groups[k]??=[]).push(x)});$("#meta").innerHTML='<span class="chip">'+filtered.length+' TEAMS</span><span class="chip">SEASON '+esc($("#season").value)+'</span><span class="chip">PF '+filtered.reduce((a,x)=>a+N(x.points_for),0)+'</span><span class="chip">PA '+filtered.reduce((a,x)=>a+N(x.points_against),0)+'</span>';$("#groups").innerHTML=Object.keys(groups).sort().map(k=>{const list=groups[k].sort((a,b)=>N(a.rank)-N(b.rank));return '<article class="card"><div class="head"><h3>'+esc(k)+'</h3><small>'+list.length+' TEAMS</small></div><table class="table"><thead><tr><th>RK</th><th>TEAM</th><th>W-L</th><th>WIN%</th><th>PF</th><th>PA</th><th>STK</th></tr></thead><tbody>'+list.map(x=>{const t=x.cr_sports_teams||{},st=N(x.streak),flags=[x.clinched_division&&"DIV",x.clinched_wild_card&&"WC",x.clinched_bye&&"BYE",x.eliminated_from_playoff_contention&&"ELIM"].filter(Boolean);return '<tr><td>'+N(x.rank)+'</td><td><div class="team">'+esc(t.short_name||t.name)+'</div><div class="sub">'+esc(t.city||"")+' '+esc(t.name||"")+'</div></td><td>'+record(x)+'</td><td>'+((N(x.win_pct)*100).toFixed(1))+'%</td><td>'+N(x.points_for)+'</td><td>'+N(x.points_against)+'</td><td class="'+(st>0?"pos":st<0?"neg":"")+'">'+(st>0?"+":"")+st+'</td></tr><tr><td colspan="7"><div class="detail">CONF '+N(x.conference_wins)+'-'+N(x.conference_losses)+' • DIV '+N(x.division_wins)+'-'+N(x.division_losses)+' • HOME '+N(x.home_wins)+'-'+N(x.home_losses)+' • AWAY '+N(x.away_wins)+'-'+N(x.away_losses)+' • NET '+N(x.net_points)+' • TD '+N(x.touchdowns)+(flags.length?" • "+flags.join(" • "):"")+'</div></td></tr>'}).join("")+'</tbody></table></article>'}).join("")||'<div class="empty">No standings loaded for this selection.</div>';$("#status").textContent=filtered.length?"Updated "+new Date().toLocaleTimeString():"No standings loaded."}
async function load(){let q=sb.from("cr_sports_standings").select("*,cr_sports_teams(name,short_name,city),cr_sports_leagues(name,code)").eq("season",String($("#season").value)).order("rank");if($("#league").value)q=q.eq("league_id",$("#league").value);const{data,error}=await q;if(error){$("#status").textContent=error.message;return}rows=data||[];filters();render()}
$("#league").onchange=load;$("#season").onchange=load;$("#conference").onchange=render;$("#division").onchange=render;$("#refresh").onclick=load;(async()=>{await leagues();await load()})();
</script><script>footer()</script></body></html>
