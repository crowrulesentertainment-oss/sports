<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings | CrowRules Sports</title><link rel="stylesheet" href="css/sports.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js"></script></head><body><script>shell("standings")</script><section class="hero"><div class="eyebrow">LEAGUE TABLES</div><h1>STANDINGS</h1><p>Division and league tables connected directly to Supabase.</p></section><section class="section"><div class="actions"><select id="league"></select><input class="input" id="season" value="2026" style="max-width:180px"></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>RK</th><th>TEAM</th><th>W</th><th>L</th><th>T</th><th>WIN %</th><th>PF</th><th>PA</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>loadSession();async function load(){let q=sb.from("cr_sports_standings").select("*,cr_sports_teams(name,city)").eq("season",$("#season").value).order("rank");if($("#league").value)q=q.eq("league_id",$("#league").value);const{data,error}=await q;$("#rows").innerHTML=error?'<tr><td colspan="8">'+esc(error.message)+'</td></tr>':data?.length?data.map(x=>'<tr><td>'+((x.rank??"-"))+'</td><td>'+esc(x.cr_sports_teams?.city)+' '+esc(x.cr_sports_teams?.name)+'</td><td>'+x.wins+'</td><td>'+x.losses+'</td><td>'+x.ties+'</td><td>'+x.win_pct+'</td><td>'+x.points_for+'</td><td>'+x.points_against+'</td></tr>').join(""):'<tr><td colspan="8">No standings loaded for this season yet.</td></tr>'}(async()=>{const{data}=await sb.from("cr_sports_leagues").select("id,name,code").order("name");$("#league").innerHTML='<option value="">All leagues</option>'+data.map(x=>'<option value="'+x.id+'">'+esc(x.code)+' — '+esc(x.name)+'</option>').join("");$("#league").onchange=load;$("#season").onchange=load;load()})()</script><script>footer()</script></body></html>
