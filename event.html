<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Center | CrowRules Sports</title>
<link rel="stylesheet" href="css/sports.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/sports.js?v=19.0"></script>
<style>
.event-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 15%,rgba(225,6,0,.22),transparent 32%),linear-gradient(135deg,#050506,#101017);min-height:470px;display:flex;align-items:end}
.event-wrap{position:relative;z-index:2;max-width:1500px;width:100%;margin:auto;padding:90px 24px 55px}.event-art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42}
.event-title{font:900 clamp(40px,7vw,90px)/.94 Orbitron;letter-spacing:-3px;margin:12px 0}.event-title span{color:#e10600}.event-meta,.actions{display:flex;gap:8px;flex-wrap:wrap}.actions{margin-top:16px}
.event-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.panel{background:#0d0d10;border:1px solid #27272b;padding:24px}.panel h2,.panel h3{font-family:Orbitron}
.scoreboard{display:grid;grid-template-columns:1fr 180px 1fr;gap:18px;align-items:center;text-align:center;padding:26px;background:linear-gradient(135deg,#0b0b0f,#111116);border:1px solid #29292f;margin-bottom:18px}
.team-side{min-width:0}.team-logo{width:100px;height:100px;object-fit:contain;background:#fff1;border-radius:16px;padding:10px}.team-name{font:900 clamp(18px,3vw,30px) Montserrat;margin-top:12px}.team-meta{font-size:10px;color:#777;margin-top:6px}.score{font:900 clamp(38px,6vw,68px) Orbitron;letter-spacing:-3px}.score.live{color:#fff}.vs{font:900 13px Orbitron;color:#e10600}.status-live{color:#ff6375;border-color:#e10600!important;background:#1b080b!important}.status-final{color:#d5d5da}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e10600;box-shadow:0 0 12px #e10600;margin-right:7px}.live-banner{display:none;margin-bottom:18px;padding:12px 15px;border:1px solid #e10600;background:#15090b;font:800 10px Orbitron}.live-banner.show{display:block}
.stat{padding:14px 0;border-bottom:1px solid #222}.stat:last-child{border-bottom:0}.muted{color:#888;line-height:1.65}.countdown{font:800 28px Orbitron}
.timeline{position:relative;margin-top:15px;padding-left:22px}.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#25252a}.tl{position:relative;padding:0 0 18px 14px}.tl:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:#e10600}.tl-time{font:800 9px Orbitron;color:#777}.tl-title{font-weight:800;margin-top:4px}.tl-detail{font-size:10px;color:#888;margin-top:3px}
.game-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.game-link{padding:12px;border:1px solid #242429;background:#09090c;text-decoration:none;color:#ddd;text-align:center;font:800 9px Orbitron}.game-link:hover{border-color:#e10600}
.related{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.related a{padding:14px;border:1px solid #242429;background:#09090c;color:#eee;text-decoration:none}.related a:hover{border-color:#e10600}
.fight-card-panel{margin-top:18px}.bout{background:#09090c;border:1px solid #242429;padding:18px;margin-top:10px}.fighter-grid{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;align-items:center}.fighter{padding:15px;background:#101015;border:1px solid #242429}.fighter-name{font:900 18px Montserrat}.fighter-record{font:800 10px Orbitron;color:#888;margin-top:6px}.fighter-image{width:64px;height:64px;border-radius:50%;object-fit:cover;float:left;margin-right:12px}.versus{text-align:center;font:900 16px Orbitron;color:#e10600}
.empty-state{padding:30px;border:1px dashed #303036;text-align:center;color:#777}.warning{font-size:11px;color:#b0b0b8;margin-top:10px}
@media(max-width:900px){.event-grid{grid-template-columns:1fr}.scoreboard{grid-template-columns:1fr 120px 1fr}.team-logo{width:75px;height:75px}.fighter-grid{grid-template-columns:1fr}.versus{padding:4px}.game-links{grid-template-columns:1fr}.related{grid-template-columns:1fr}}
@media(max-width:560px){.scoreboard{grid-template-columns:1fr}.score{order:-1}.event-wrap{padding-top:65px}}
.timeline-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.timeline-tab{border:1px solid #28282e;background:#09090c;color:#9da4b1;padding:9px 12px;border-radius:8px;font:800 8px Orbitron;cursor:pointer}.timeline-tab.active,.timeline-tab:hover{border-color:#e10600;color:#fff;background:#16090b}.play-row{display:grid;grid-template-columns:70px 58px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #222;align-items:start}.play-time,.period{font:800 9px Orbitron;color:#777}.play-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#17171c;font:900 12px Orbitron}.play-title{font-weight:800}.play-detail{font-size:10px;color:#858b98;margin-top:4px;line-height:1.5}.drive{padding:14px 0;border-bottom:1px solid #222}.drive-head{display:flex;justify-content:space-between;gap:12px;font:800 10px Orbitron}.drive-meta{font-size:10px;color:#858b98;margin-top:6px}.inning,.period-block,.round{padding:13px 0;border-bottom:1px solid #222}.score-line{display:flex;justify-content:space-between;gap:12px;font-weight:800}.badge{font:800 8px Orbitron;padding:5px 7px;border:1px solid #29292f;border-radius:6px;color:#aaa}.timeline-empty{padding:20px;border:1px dashed #303036;color:#777;text-align:center}@media(max-width:600px){.play-row{grid-template-columns:55px 42px 1fr}}</style></head>
<body>
<script>shell("event")</script>
<section class="event-hero"><div class="event-art" id="heroArt"></div><div class="event-wrap"><div class="eyebrow">CROWRULES SPORTS • UNIVERSAL GAME CENTER</div><div id="hero">Loading Game Center…</div></div></section>
<section class="section"><div id="liveBanner" class="live-banner"><span class="live-dot"></span><span id="liveText">LIVE EVENT</span></div><div id="scoreboard"></div><div class="event-grid"><div><div class="panel"><div class="eyebrow">GAME CENTER 2.0</div><h2 id="timelineHeading">Live Timeline & Game Information</h2><div class="timeline-tabs" id="timelineTabs"></div><div id="timeline"></div></div><div class="panel" style="margin-top:18px"><div class="eyebrow">RELATED</div><div id="related"></div></div></div><aside><div class="panel"><div class="eyebrow">EVENT STATUS</div><h3 id="statusTitle">—</h3><div class="countdown" id="countdown">—</div><p class="muted" id="statusCopy">Loading current event status.</p><div class="game-links"><a class="game-link" href="scores.html">SCORES</a><a class="game-link" href="teams.html">TEAMS</a><a class="game-link" href="combat.html">COMBAT</a></div><div class="actions"><button class="button small" id="shareBtn">SHARE</button><button class="button small secondary" id="refreshBtn">REFRESH</button></div></div><div class="panel" style="margin-top:18px"><div class="eyebrow">DETAILS</div><div id="details"></div></div></aside></div><div id="specialMount"></div></section>
<script>
loadSession();
const params=new URLSearchParams(location.search),id=params.get("id");let eventRecord=null,gameRecord=null,timer;
const q=(s)=>document.querySelector(s), n=v=>Number.isFinite(Number(v))?Number(v):0;
const fmt=v=>v?new Date(v).toLocaleString([],{dateStyle:"full",timeStyle:"short"}):"TBD";
const escv=v=>esc(v==null?"":String(v));
function stat(s){return String(s||"").toLowerCase().replace(/[- ]/g,"_")}
function live(s){return ["live","in_progress","inprogress","playing","active","ongoing"].includes(stat(s))}
function final(s){return ["final","completed","complete","closed","finished"].includes(stat(s))}
function resultLabel(g,teamId){if(!final(g.status))return "";const home=g.home_team_id===teamId,me=home?n(g.home_score):n(g.away_score),op=home?n(g.away_score):n(g.home_score);return me>op?"W":me<op?"L":"T"}
function teamObj(g,side){return side==="home"?g.home:g.away}
function renderTeam(t,score){return '<div class="team-side">'+(t?.logo_url?'<img class="team-logo" src="'+escv(t.logo_url)+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="team-name">'+escv(t?.name||t?.short_name||"TBD")+'</div><div class="team-meta">'+escv([t?.city,t?.state,t?.division].filter(Boolean).join(" • "))+'</div></div>'}
async function load(){
 if(!id){renderMissing();return}
 let er=await sb.from("cr_sports_events").select("id,title,event_type,status,starts_at,ends_at,venue,city,broadcast,event_url,image_url,description,provider_updated_at,provider_event_id,cr_sports_leagues(code,name,sport)").eq("id",id).maybeSingle();
 if(er.error||!er.data){const pr=await sb.from("cr_sports_events").select("id,title,event_type,status,starts_at,ends_at,venue,city,broadcast,event_url,image_url,description,provider_updated_at,provider_event_id,cr_sports_leagues(code,name,sport)").eq("provider_event_id",id).maybeSingle();if(!pr.error&&pr.data)er=pr}
 if(er.data){eventRecord=er.data;await renderEvent();return}
 const gr=await sb.from("cr_sports_games").select("id,league_id,home_team_id,away_team_id,starts_at,status,home_score,away_score,venue,broadcast,home:cr_sports_teams!cr_sports_games_home_team_id_fkey(id,name,short_name,city,state,division,logo_url),away:cr_sports_teams!cr_sports_games_away_team_id_fkey(id,name,short_name,city,state,division,logo_url),cr_sports_leagues(code,name,sport)").eq("id",id).maybeSingle();
 if(gr.error||!gr.data){renderNotFound(gr.error?.message);return}
 gameRecord=gr.data;await renderGame();
}
function renderMissing(){q("#hero").innerHTML='<h1 class="event-title">GAME <span>CENTER</span></h1><p class="muted">Open a game from Scores or a Team Hub to enter the Universal Game Center.</p><div class="actions"><a class="button" href="scores.html">OPEN SCORES</a><a class="button secondary" href="teams.html">OPEN TEAMS</a></div>';q("#scoreboard").innerHTML=""}
function renderNotFound(msg){q("#hero").innerHTML='<h1 class="event-title">EVENT <span>NOT FOUND</span></h1><p class="muted">This Game Center record could not be found.</p><p class="warning">'+escv(msg||"")+'</p><div class="actions"><a class="button" href="scores.html">BACK TO SCORES</a></div>'}
async function renderGame(){
 const g=gameRecord,l=g.cr_sports_leagues||{},isLive=live(g.status),isFinal=final(g.status),title=(g.home?.short_name||g.home?.name||"Home")+" vs "+(g.away?.short_name||g.away?.name||"Away");
 document.title=title+" | CrowRules Sports";
 q("#hero").innerHTML='<div class="event-meta"><span class="tag">'+escv(l.code||"SPORTS")+'</span><span class="tag '+(isLive?"status-live":isFinal?"status-final":"")+'">'+escv(String(g.status||"SCHEDULED").toUpperCase())+'</span></div><h1 class="event-title">'+escv(g.home?.short_name||g.home?.name||"HOME")+' <span>VS</span> '+escv(g.away?.short_name||g.away?.name||"AWAY")+'</h1><p class="muted">'+escv(fmt(g.starts_at))+' • '+escv(g.venue||"Venue TBD")+'</p>';
 q("#heroArt").style.backgroundImage="linear-gradient(90deg,rgba(5,5,6,.95),rgba(5,5,6,.45))";
 q("#scoreboard").innerHTML='<div class="scoreboard">'+renderTeam(g.home,g.home_score)+'<div><div class="vs">'+(isLive?"LIVE":"FINAL"===String(g.status).toUpperCase()?"FINAL":"VS")+'</div><div class="score '+(isLive?"live":"")+'">'+n(g.home_score)+' — '+n(g.away_score)+'</div><div class="team-meta">'+escv(l.name||"League")+'</div></div>'+renderTeam(g.away,g.away_score)+'</div>';
 q("#liveBanner").classList.toggle("show",isLive);q("#liveText").textContent=isLive?"LIVE NOW • "+title:"";
 q("#statusTitle").textContent=String(g.status||"SCHEDULED").toUpperCase();q("#statusCopy").textContent=isLive?"This game is currently marked live by the CrowRules sports data feed.":isFinal?"The game has been marked final.":"Countdown to scheduled start.";
 q("#details").innerHTML='<div class="stat"><strong>WHEN</strong><div class="muted">'+escv(fmt(g.starts_at))+'</div></div><div class="stat"><strong>VENUE</strong><div class="muted">'+escv(g.venue||"Venue TBD")+'</div></div><div class="stat"><strong>BROADCAST</strong><div class="muted">'+escv(g.broadcast||"Not listed")+'</div></div><div class="stat"><strong>LEAGUE</strong><div class="muted">'+escv(l.name||"Sports")+'</div></div>';
 await renderSportTimeline(g);
 q("#related").innerHTML='<div class="related"><a href="teams.html?id='+encodeURIComponent(g.home_team_id)+'"><b>'+escv(g.home?.name||"Home Team")+'</b><br><span class="muted">HOME TEAM HUB →</span></a><a href="teams.html?id='+encodeURIComponent(g.away_team_id)+'"><b>'+escv(g.away?.name||"Away Team")+'</b><br><span class="muted">AWAY TEAM HUB →</span></a></div>';
 q("#specialMount").innerHTML="";
 tick();bindActions();await loadSpecial(l.code);
}
function sportType(g){const c=String(g.cr_sports_leagues?.code||"").toUpperCase(),n=String(g.cr_sports_leagues?.sport||"").toLowerCase();if(/NFL|NCAA|UFL|CFL/.test(c)||/football/.test(n))return"football";if(/MLB|MILB|NCAA_BASEBALL/.test(c)||/baseball/.test(n))return"baseball";if(/NBA|WNBA|NCAA_BASKETBALL/.test(c)||/basketball/.test(n))return"basketball";if(/NHL|AHL/.test(c)||/hockey/.test(n))return"hockey";if(/MLS|NWSL|NCAA_SOCCER/.test(c)||/soccer/.test(n))return"soccer";return"general"}
async function loadLiveEvents(gameId){
 const r=await sb.from("cr_sports_game_events").select("id,game_id,sequence,quarter,time_remaining,event_type,description,is_scoring_play,away_score,home_score,payload,occurred_at,created_at").eq("game_id",gameId).order("occurred_at",{ascending:true}).order("sequence",{ascending:true}).limit(1000);
 if(r.error) return {rows:[],error:r.error.message};
 return {rows:r.data||[],error:null};
}
function eventClock(x){return x.time_remaining||x.payload?.clock?.displayValue||x.payload?.clock||x.payload?.wallclock||x.occurred_at||""}
function eventIcon(x,type){const t=String(x.event_type||x.payload?.type?.type||"").toLowerCase();if(x.is_scoring_play)return"+";if(type==="baseball")return t.includes("strike")?"K":t.includes("ball")?"B":"⚾";if(type==="basketball")return t.includes("foul")?"F":"●";if(type==="hockey")return t.includes("goal")?"G":t.includes("penalt")?"P":"•";if(type==="soccer")return t.includes("goal")?"G":t.includes("card")?"C":"•";return"•"}
function eventRows(rows,type){return rows.slice().sort((a,b)=>{const sa=a.sequence??Number(a.payload?.sequenceNumber??0),sb=b.sequence??Number(b.payload?.sequenceNumber??0);return sa-sb||new Date(a.occurred_at||0)-new Date(b.occurred_at||0)}).reverse().map(x=>'<div class="play-row"><div class="play-time">'+escv(eventClock(x))+'</div><div class="play-icon">'+eventIcon(x,type)+'</div><div><div class="play-title">'+escv(x.event_type||x.payload?.type?.text||"Game Event")+(x.is_scoring_play?' • SCORE':'')+'</div><div class="play-detail">'+escv(x.description||x.payload?.text||"Event recorded by the live feed")+'</div><div class="play-detail">'+escv(x.quarter||x.payload?.period?.displayValue||"")+(x.away_score!=null||x.home_score!=null?' • '+n(x.away_score)+' — '+n(x.home_score):'')+'</div></div></div>').join("")}
function genericLiveTimeline(rows,type){if(!rows.length)return '<div class="timeline-empty">No live event records are currently stored for this game. The Game Center will populate automatically when the feed sends them.</div>';return '<div class="live-feed">'+eventRows(rows,type)+'</div>'}
function footballDrives(rows,g){if(!rows.length)return genericLiveTimeline(rows,"football");const groups=[];for(const x of rows){const key=x.payload?.driveId||x.payload?.drive?.id||x.payload?.possession||x.payload?.team?.id||x.quarter||"GAME";let group=groups.find(z=>z.key===String(key));if(!group){group={key:String(key),rows:[]};groups.push(group)}group.rows.push(x)}return groups.map((d,i)=>'<div class="drive"><div class="drive-head"><span>DRIVE '+(groups.length-i)+'</span><span class="badge">'+escv(d.rows[d.rows.length-1]?.quarter||"LIVE")+'</span></div><div class="drive-meta">'+escv(d.rows.length)+' live events • '+escv(d.rows[0]?.description||"Possession data")+'</div>'+eventRows(d.rows,"football")+'</div>').join("")}
function baseballInnings(rows){if(!rows.length)return genericLiveTimeline(rows,"baseball");const groups={};rows.forEach(x=>{const key=x.quarter||x.payload?.period?.displayValue||"Game";(groups[key]??=[]).push(x)});return Object.entries(groups).reverse().map(([key,items])=>'<div class="inning"><div class="score-line"><span>'+escv(key)+'</span><span class="badge">'+items.length+' EVENTS</span></div>'+eventRows(items,"baseball")+'</div>').join("")}
function hockeyPeriods(rows){if(!rows.length)return genericLiveTimeline(rows,"hockey");const groups={};rows.forEach(x=>{const key=x.quarter||x.payload?.period?.displayValue||"Game";(groups[key]??=[]).push(x)});return Object.entries(groups).reverse().map(([key,items])=>'<div class="period-block"><div class="score-line"><span>'+escv(key)+'</span><span class="badge">'+items.length+' EVENTS</span></div>'+eventRows(items,"hockey")+'</div>').join("")}
function sportEventFeed(rows,type){return genericLiveTimeline(rows,type)}
async function renderSportTimeline(g){const type=sportType(g),tabs={football:["DRIVES","GAME INFO"],baseball:["INNINGS","GAME INFO"],basketball:["PLAY-BY-PLAY","GAME INFO"],hockey:["PERIODS","GAME INFO"],soccer:["MATCH EVENTS","GAME INFO"],general:["TIMELINE","GAME INFO"]}[type]||["TIMELINE","GAME INFO"];const liveData=await loadLiveEvents(g.id);g._liveEvents=liveData.rows;g._liveEventError=liveData.error;q("#timelineTabs").innerHTML=tabs.map((t,i)=>'<button class="timeline-tab '+(i===0?"active":"")+'" data-tab="'+i+'">'+t+'</button>').join("");q("#timelineTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{q("#timelineTabs").querySelectorAll("button").forEach(z=>z.classList.remove("active"));b.classList.add("active");renderTimelineTab(g,type,Number(b.dataset.tab))});renderTimelineTab(g,type,0)}
function renderTimelineTab(g,type,tab){q("#timelineHeading").textContent=({football:"Football Drives & Live Events",baseball:"Baseball Innings & Live Events",basketball:"Basketball Play-by-Play",hockey:"Hockey Periods & Live Events",soccer:"Soccer Match Events",general:"Live Timeline & Game Information"}[type]);if(tab===1){q("#timeline").innerHTML=timelineForGame(g);return}const rows=g._liveEvents||[];let html="";if(type==="football")html=footballDrives(rows,g);else if(type==="baseball")html=baseballInnings(rows);else if(type==="basketball")html=sportEventFeed(rows,"basketball");else if(type==="hockey")html=hockeyPeriods(rows);else if(type==="soccer")html=sportEventFeed(rows,"soccer");else html=genericLiveTimeline(rows,"general");if(g._liveEventError)html='<div class="warning">Live event feed error: '+escv(g._liveEventError)+'</div>'+html;q("#timeline").innerHTML=html}
function timelineForGame(g){const rows=[];rows.push({time:g.starts_at,title:"Scheduled Start",detail:(g.venue||"Venue TBD")+" • "+(g.broadcast||"Broadcast TBD")});if(live(g.status))rows.push({time:new Date().toISOString(),title:"LIVE STATUS",detail:"Game currently marked live in the sports feed."});if(final(g.status))rows.push({time:g.starts_at,title:"FINAL",detail:"Final score: "+n(g.home_score)+" — "+n(g.away_score)});return '<div class="timeline">'+rows.map(x=>'<div class="tl"><div class="tl-time">'+escv(fmt(x.time))+'</div><div class="tl-title">'+escv(x.title)+'</div><div class="tl-detail">'+escv(x.detail)+'</div></div>').join("")+'</div>'}
async function loadSpecial(code){
 const c=String(code||"").toUpperCase();
 if(!["UFC","WWE","AEW"].includes(c))return;
 if(!eventRecord)return;
 q("#specialMount").innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">'+escv(c)+' • EVENT DATA</div><h2>Loading Event Card…</h2><p class="muted">Resolving the synchronized combat data for this event.</p></div>';
 if(c==="UFC"){const r=await sb.from("cr_sports_event_bouts").select("*").eq("event_id",eventRecord.id).order("bout_order",{ascending:true});if(r.error||!r.data?.length){q("#specialMount").innerHTML='<div class="panel fight-card-panel"><h2>FIGHT CARD PENDING</h2><p class="muted">The event is connected, but verified UFC bout records are not currently available.</p></div>';return}q("#specialMount").innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">UFC • FIGHT CARD</div><h2>'+escv(eventRecord.title)+'</h2>'+r.data.map(b=>'<article class="bout"><div class="fighter-grid"><div class="fighter"><div class="fighter-name">'+escv(b.red_fighter||"TBD")+'</div><div class="fighter-record">'+escv([b.red_fighter_wins,b.red_fighter_losses,b.red_fighter_draws].filter(x=>x!=null).join("-")||"Record unavailable")+'</div></div><div class="versus">VS</div><div class="fighter"><div class="fighter-name">'+escv(b.blue_fighter||"TBD")+'</div><div class="fighter-record">'+escv([b.blue_fighter_wins,b.blue_fighter_losses,b.blue_fighter_draws].filter(x=>x!=null).join("-")||"Record unavailable")+'</div></div></div><div class="warning">'+escv(b.weight_class||"Bout")+' • '+escv(b.status||"Scheduled")+(b.winner?" • Winner: "+escv(b.winner):"")+'</div></article>').join("")+'</div>';return}
 const r=await sb.from("cr_sports_wrestling_events").select("*").eq("organization",c).eq("provider_event_id",eventRecord.provider_event_id||"").maybeSingle();if(r.error||!r.data){q("#specialMount").innerHTML='<div class="panel fight-card-panel"><h2>COMBAT CARD PENDING</h2><p class="muted">The event is connected, but synchronized '+escv(c)+' match data has not arrived yet.</p></div>';return}
 const m=await sb.from("cr_sports_wrestling_matches").select("*").eq("event_id",r.data.id).order("match_order",{ascending:true});q("#specialMount").innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">'+escv(c)+' • MATCH CARD</div><h2>'+escv(eventRecord.title)+'</h2>'+((m.data||[]).map((x,i)=>'<article class="bout"><div class="fighter-grid"><div class="fighter"><div class="fighter-name">'+escv(x.red_name||"TBD")+'</div></div><div class="versus">VS</div><div class="fighter"><div class="fighter-name">'+escv(x.blue_name||"TBD")+'</div></div></div><div class="warning">MATCH '+(i+1)+' • '+escv(x.match_type||"Match")+' • '+escv(x.result||"Scheduled")+(x.winner_name?" • Winner: "+escv(x.winner_name):"")+'</div></article>').join("")||'<div class="empty-state">Match card pending.</div>')+'</div>';
}
async function renderEvent(){
