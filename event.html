<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Center | CrowRules Sports</title>
<link rel="stylesheet" href="css/sports.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/sports.js"></script>
<style>
.event-hero{min-height:520px;display:flex;align-items:end;background:radial-gradient(circle at 80% 20%,rgba(225,6,0,.2),transparent 30%),linear-gradient(135deg,#050506,#101017)}
.event-wrap{max-width:1500px;width:100%;margin:auto;padding:80px 24px 55px}
.event-title{font:900 clamp(46px,8vw,100px)/.95 Orbitron;letter-spacing:-4px;margin:12px 0}.event-title span{color:#e10600}
.event-meta{display:flex;gap:8px;flex-wrap:wrap}.event-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.panel{background:#0d0d10;border:1px solid #27272b;padding:24px}.panel h2,.panel h3{font-family:Orbitron}
.muted{color:#888;line-height:1.7}.stat{padding:14px 0;border-bottom:1px solid #222}.stat:last-child{border-bottom:0}
.countdown{font:800 28px Orbitron}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.fight-card-panel{margin-top:18px}.fight-card-head{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}
.fight-card-grid{display:grid;gap:14px;margin-top:20px}.card-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding:10px;border:1px solid #242429;background:#09090c}.card-filter{border:1px solid #29292f;background:#111116;color:#aaa;padding:9px 12px;font:800 10px Orbitron;cursor:pointer}.card-filter.active{color:#fff;border-color:#e10600;background:#171114}.bout[data-card="main"]{border-left:3px solid #e10600}.bout[data-card="prelim"]{border-left:3px solid #29292f}.card-badge{display:inline-block;margin-left:8px;padding:4px 6px;border:1px solid #332020;color:#e10600;font:800 8px Orbitron;vertical-align:middle}.progress-wrap{margin-top:14px;background:#09090c;border:1px solid #222;padding:10px}.progress-top{display:flex;justify-content:space-between;gap:10px;font:800 9px Orbitron;color:#777}.progress-track{height:4px;background:#202025;margin-top:8px;overflow:hidden}.progress-fill{height:100%;background:#e10600;transition:width .4s ease}.intel{margin-top:14px;border-top:1px solid #25252a;padding-top:14px}.intel summary{cursor:pointer;list-style:none;font:800 10px Orbitron;color:#aaa}.intel summary::-webkit-details-marker{display:none}.intel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.intel-box{background:#0a0a0e;border:1px solid #202025;padding:10px}.intel-label{font:800 9px Orbitron;color:#777;text-transform:uppercase}.intel-value{font:800 13px Montserrat;color:#eee;margin-top:6px}.history{margin-top:12px}.history-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #202025;font-size:11px}.history-row:last-child{border-bottom:0}.live-strip{display:none;margin-top:14px;border:1px solid #442020;background:#120a0a;padding:12px}.live-strip.active{display:block}.live-main{display:flex;justify-content:space-between;gap:12px;align-items:center}.live-round{font:900 18px Orbitron;color:#e10600}.live-clock{font:900 24px Orbitron}.live-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.live-stat{background:#09090c;border:1px solid #242429;padding:8px;text-align:center;font:800 11px Montserrat}
.bout{background:#09090c;border:1px solid #242429;padding:18px;overflow:hidden}
.bout-top{display:grid;grid-template-columns:90px 1fr 80px;gap:16px;align-items:center;margin-bottom:16px}
.bout-order{font:800 12px Orbitron;color:#777}.weight{text-align:center;font:800 11px Orbitron;color:#aaa;text-transform:uppercase}.bout-status{text-align:right;font:800 11px Orbitron;color:#888}
.fighter-grid{display:grid;grid-template-columns:1fr 80px 1fr;gap:16px;align-items:stretch}
.fighter-card{position:relative;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,#111116,#08080b);border:1px solid #25252a;padding:18px}
.fighter-card.blue{border-color:#20242d}.fighter-card.red{border-color:#302020}
.fighter-head{display:flex;align-items:center;gap:14px;min-width:0}.fighter-card.blue .fighter-head{flex-direction:row-reverse;text-align:right}
.fighter-card img{width:82px;height:82px;object-fit:cover;border-radius:50%;border:1px solid #3a3a40;background:#15151a;flex:0 0 auto}
.fighter-name{font:900 clamp(18px,2.2vw,26px)/1.05 Montserrat,Arial,sans-serif}.fighter-side{font:800 10px Orbitron;letter-spacing:1px;color:#777;margin-bottom:6px}
.fighter-record{font:800 13px Orbitron;color:#ddd;margin-top:6px}.fighter-rank{font:800 10px Orbitron;color:#e10600;margin-top:5px}
.tape{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.tape-item{background:#0a0a0e;border:1px solid #202025;padding:9px}.tape-label{font:700 9px Orbitron;color:#777;text-transform:uppercase}.tape-value{font:800 12px Montserrat;margin-top:4px;color:#eee;word-break:break-word}
.fighter-card.blue .tape{text-align:right}.fighter-card.blue .tape-item{text-align:right}\n.profile-live{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 8px;border:1px solid #25252a;background:#0b0b0f;font:800 9px Orbitron;color:#777;letter-spacing:.6px}.profile-live.complete{border-color:#31313a;color:#ddd}.profile-live.partial{border-color:#3a3020;color:#c7aa73}.profile-live.pending{border-color:#29292e;color:#666}.profile-dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.versus{display:flex;align-items:center;justify-content:center;font:900 18px Orbitron;color:#e10600}
.result-row{margin-top:14px;padding-top:12px;border-top:1px solid #25252a;text-align:center}.result{font:800 12px Montserrat;color:#eee}.result.muted-result{color:#777}
.sync-note{font-size:12px;color:#777;margin-top:12px}.profile-source{font:700 9px Orbitron;color:#666;margin-top:auto;padding-top:14px;text-transform:uppercase;letter-spacing:.6px}
@media(max-width:900px){.event-grid{grid-template-columns:1fr}.fighter-grid{grid-template-columns:1fr}.versus{min-height:36px}.fighter-card.blue .fighter-head{flex-direction:row;text-align:left}.fighter-card.blue .tape,.fighter-card.blue .tape-item{text-align:left}}
@media(max-width:620px){.bout-top{grid-template-columns:55px 1fr}.bout-status{grid-column:2;text-align:left}.fighter-head{align-items:flex-start}.fighter-card img{width:68px;height:68px}.tape{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script>shell("combat")</script>
<section class="event-hero"><div class="event-wrap">
 <div class="eyebrow">CROWRULES SPORTS • SPORTS 23.1 EVENT CENTER</div>
 <div id="hero">Loading Event Center…</div>
</div></section>
<section class="section">
 <div class="event-grid" id="eventBody"><div class="panel"><h2>Loading…</h2></div></div>
 <div id="fightCardMount"></div>
</section>
<script>
loadSession();
const params=new URLSearchParams(location.search),id=params.get("id");let eventRecord=null;
function fmtDate(v){return v?new Date(v).toLocaleString([],{dateStyle:"full",timeStyle:"short"}):"TBD";}
function statusClass(s){return String(s||"scheduled").toLowerCase();}
function isUfc(){return String(eventRecord?.cr_sports_leagues?.code||"").toUpperCase()==="UFC";}
function val(v,fallback="—"){return v===null||v===undefined||String(v).trim()===""?fallback:String(v);}
function record(w,l,d){return (w??"—")+"-"+(l??"—")+(d!==null&&d!==undefined?"-"+d:"");}
async function loadEvent(){
 if(!id){
  document.getElementById("hero").innerHTML="<h1 class='event-title'>EVENT <span>SELECT AN EVENT</span></h1><p class='muted'>Open an event from Combat, Scores or Schedule to enter the Event Center.</p><div class='actions'><a class='button' href='combat.html'>OPEN COMBAT</a><a class='button secondary' href='schedule.html'>OPEN SCHEDULE</a></div>";
  document.getElementById("eventBody").innerHTML="";
  return;
 }
 let r=await sb.from("cr_sports_events").select("id,title,event_type,status,starts_at,ends_at,venue,city,broadcast,event_url,image_url,description,provider_updated_at,provider_event_id,cr_sports_leagues(code,name)").eq("id",id).maybeSingle();
 if((r.error||!r.data)&&id){
   const byProvider=await sb.from("cr_sports_events").select("id,title,event_type,status,starts_at,ends_at,venue,city,broadcast,event_url,image_url,description,provider_updated_at,provider_event_id,cr_sports_leagues(code,name)").eq("provider_event_id",id).maybeSingle();
   if(!byProvider.error&&byProvider.data)r=byProvider;
 }
 if(r.error||!r.data){document.getElementById("hero").innerHTML="<h1 class='event-title'>EVENT <span>NOT FOUND</span></h1><p class='muted'>This Event Center record could not be found.</p><div class='actions'><a class='button' href='combat.html'>BACK TO COMBAT</a></div>";return;}
 eventRecord=r.data;await renderEvent();
}
async function renderEvent(){
 const e=eventRecord,league=e.cr_sports_leagues?.name||"SPORTS";document.title=e.title+" | CrowRules Sports";
 document.getElementById("hero").innerHTML='<div class="event-meta"><span class="tag">'+esc(league)+'</span><span class="tag '+statusClass(e.status)+'">'+esc(String(e.status||"scheduled").toUpperCase())+'</span><span class="tag">'+esc(e.event_type||"EVENT")+'</span></div><h1 class="event-title">'+esc(e.title)+'</h1><p class="muted">'+esc(e.description||"Dedicated CrowRules Sports Event Center.")+'</p><div class="actions"><button class="button" id="followBtn">FOLLOW EVENT</button>'+(e.event_url?'<a class="button secondary" href="'+esc(e.event_url)+'" target="_blank" rel="noopener">OFFICIAL EVENT</a>':"")+'<a class="button secondary" href="combat.html">BACK TO COMBAT</a></div>';
 document.getElementById("eventBody").innerHTML='<div class="panel"><div class="eyebrow">EVENT DETAILS</div><h2>'+esc(e.title)+'</h2><div class="stat"><strong>WHEN</strong><div class="muted">'+esc(fmtDate(e.starts_at))+'</div></div><div class="stat"><strong>VENUE</strong><div class="muted">'+esc(e.venue||"Venue TBD")+'</div></div><div class="stat"><strong>LOCATION</strong><div class="muted">'+esc(e.city||"Location TBD")+'</div></div><div class="stat"><strong>BROADCAST</strong><div class="muted">'+esc(e.broadcast||"See official event information")+'</div></div><div class="stat"><strong>LAST PROVIDER UPDATE</strong><div class="muted">'+esc(fmtDate(e.provider_updated_at))+'</div></div></div><aside class="panel"><div class="eyebrow">EVENT STATUS</div><h3>'+esc(String(e.status||"scheduled").toUpperCase())+'</h3><div class="countdown" id="countdown">--:--:--</div><p class="muted">Countdown to the scheduled start. Live status is controlled by the event data source.</p><div class="actions"><a class="button small" href="scores.html">SCORES</a><a class="button small secondary" href="schedule.html">SCHEDULE</a></div></aside>';
 await bindFollow();tick();
 if(isUfc()) await loadUfcFightCard();
 else if(["WWE","AEW"].includes(String(eventRecord?.cr_sports_leagues?.code||"").toUpperCase())) await loadWrestlingCard();
 else document.getElementById("fightCardMount").innerHTML="";
}
async function bindFollow(){
 const b=document.getElementById("followBtn"),s=await sb.auth.getSession(),u=s.data.session?.user;
 if(!u){b.textContent="SIGN IN TO FOLLOW";b.onclick=()=>location.href="account.html";return;}
 const r=await sb.from("cr_sports_user_followed_events").select("event_id").eq("user_id",u.id).eq("event_id",eventRecord.id).maybeSingle();let following=!!r.data;b.textContent=following?"FOLLOWING":"FOLLOW EVENT";
 b.onclick=async()=>{if(following){await sb.from("cr_sports_user_followed_events").delete().eq("user_id",u.id).eq("event_id",eventRecord.id);following=false;}else{await sb.from("cr_sports_user_followed_events").upsert({user_id:u.id,event_id:eventRecord.id});following=true;}b.textContent=following?"FOLLOWING":"FOLLOW EVENT";};
}
async function loadWrestlingCard(){
 const mount=document.getElementById("fightCardMount");
 mount.innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">WRESTLING EVENT CENTER</div><h2>Loading Match Card…</h2><p class="muted">Loading WWE / AEW matches from the CrowRules wrestling data layer.</p></div>';
 const r=await sb.from("cr_sports_wrestling_matches").select("*").eq("event_id",eventRecord.id).order("match_order",{ascending:true});
 if(r.error){mount.innerHTML='<div class="panel fight-card-panel"><h2>MATCH CARD UNAVAILABLE</h2><p class="muted">'+esc(r.error.message)+'</p></div>';return;}
 const rows=r.data||[];
 if(!rows.length){mount.innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">'+esc(eventRecord.cr_sports_leagues?.code||"WRESTLING")+' EVENT CENTER</div><h2>MATCH CARD PENDING</h2><p class="muted">The event is synchronized, but no verified matches are stored yet.</p><div class="actions"><a class="button small" href="combat.html">BACK TO COMBAT</a></div></div>';return;}
 mount.innerHTML='<div class="panel fight-card-panel"><div class="fight-card-head"><div><div class="eyebrow">'+esc(eventRecord.cr_sports_leagues?.code||"WRESTLING")+' • MATCH CARD</div><h2>'+esc(eventRecord.title)+'</h2></div><div class="tag">'+rows.length+' MATCHES</div></div><p class="muted">Wrestling matches are synchronized separately from UFC fight-bout data.</p><div class="fight-card-grid">'+rows.map((m,i)=>'<article class="bout"><div class="bout-top"><div class="bout-order">MATCH '+String(i+1).padStart(2,"0")+'</div><div class="weight">'+esc(m.match_type||"MATCH")+(m.title_fight?" • TITLE":"")+'</div><div class="bout-status">'+esc(String(m.result||"SCHEDULED").toUpperCase())+'</div></div><div class="fighter-grid"><div class="fighter-card red"><div class="fighter-head"><div><div class="fighter-side">RED / FIRST COMPETITOR</div><div class="fighter-name">'+esc(m.red_name||"TBD")+'</div></div></div></div><div class="versus">VS</div><div class="fighter-card blue"><div class="fighter-head"><div><div class="fighter-side">BLUE / SECOND COMPETITOR</div><div class="fighter-name">'+esc(m.blue_name||"TBD")+'</div></div></div></div></div><div class="result-row"><div class="result">'+esc(m.winner_name||m.result||"SCHEDULED")+(m.method?" • "+esc(m.method):"")+'</div>'+(m.round?'<div class="sync-note">Round / time: '+esc(m.round)+'</div>':"")+(m.title_fight?'<div class="sync-note">Championship match</div>':"")+'</div></article>').join("")+'</div><div class="sync-note">WWE / AEW data • CrowRules wrestling-sync • Supabase Realtime</div></div>';
}
async function syncUfcCard(){const result=await sb.functions.invoke("ufc-card-sync",{body:{event_id:eventRecord.id}});if(result.error)return{ok:false,error:result.error.message};return result.data||{ok:true};}
function shouldRefresh(rows){if(!rows.length)return true;const latest=rows.reduce((m,r)=>Math.max(m,new Date(r.provider_updated_at||r.updated_at||0).getTime()),0);return !latest||Date.now()-latest>2*60*60*1000;}
function findStat(obj,keys){if(!obj||typeof obj!=="object")return null;const wanted=keys.map(k=>k.toLowerCase().replace(/[^a-z0-9]/g,""));if(Array.isArray(obj)){for(const v of obj){const x=findStat(v,keys);if(x!=null)return x}return null}for(const [k,v] of Object.entries(obj)){const nk=k.toLowerCase().replace(/[^a-z0-9]/g,"");if(wanted.includes(nk)&&(typeof v!=="object"&&v!==null))return v;const x=findStat(v,keys);if(x!=null)return x}return null}
function fighterIntel(slug,profiles,stats,fights){const p=profiles[slug]||{},st=stats[slug]?.stats||{},fh=fights[slug]?.fights||[];const vals=[["AGE",p.age],["COUNTRY",p.country],["WEIGHT CLASS",p.weight_class],["SIG. STRIKE %",findStat(st,["sigStrikeAccuracy","significantStrikeAccuracy","sigStrAccuracy"])],["TAKEDOWN %",findStat(st,["takedownAccuracy","tdAccuracy"])],["STRIKE DEFENSE",findStat(st,["strikeDefense","sigStrikeDefense"])],["TD DEFENSE",findStat(st,["takedownDefense","tdDefense"])]].filter(x=>x[1]!==null&&x[1]!==undefined&&String(x[1]).trim()!=="");const recent=fh.slice(0,5);return '<details class="intel"><summary>VIEW FIGHTER INTELLIGENCE</summary><div class="intel-grid">'+(vals.length?vals.map(x=>'<div class="intel-box"><div class="intel-label">'+esc(x[0])+'</div><div class="intel-value">'+esc(val(x[1]))+'</div></div>').join(""):'<div class="sync-note">Career statistics are still being enriched.</div>')+'</div><div class="history"><div class="intel-label">RECENT FIGHT HISTORY</div>'+(recent.length?recent.map(f=>'<div class="history-row"><span>'+esc(f.opponent||f.opponentName||f.event||"Previous bout")+'</span><strong>'+esc(f.result||f.outcome||"—")+'</strong></div>').join(""):'<div class="sync-note">Fight history is still being enriched.</div>')+'</div></details>'}
function profileProgress(rows){let total=rows.length*2,complete=0;rows.forEach(b=>["red","blue"].forEach(side=>{const slug=side==="red"?b.red_fighter_slug:b.blue_fighter_slug,h=side==="red"?b.red_fighter_height:b.blue_fighter_height,st=side==="red"?b.red_fighter_stance:b.blue_fighter_stance,w=side==="red"?b.red_fighter_wins:b.blue_fighter_wins,l=side==="red"?b.red_fighter_losses:b.blue_fighter_losses;if(slug&&h&&st&&w!==null&&w!==undefined&&l!==null&&l!==undefined)complete++;}));return{total,complete,percent:total?Math.round(complete/total*100):0};}
function bindCardFilters(){document.querySelectorAll(".card-filter").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".card-filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");const f=btn.dataset.filter;document.querySelectorAll(".bout").forEach(b=>{b.style.display=f==="all"?"":(b.dataset.card===f?"":"none");});}));}
function fighterCard(b,side){
 const red=side==="red",name=red?b.red_fighter:b.blue_fighter,image=red?b.red_fighter_image_url:b.blue_fighter_image_url,height=red?b.red_fighter_height:b.blue_fighter_height,reach=red?b.red_fighter_reach:b.blue_fighter_reach,stance=red?b.red_fighter_stance:b.blue_fighter_stance,wins=red?b.red_fighter_wins:b.blue_fighter_wins,losses=red?b.red_fighter_losses:b.blue_fighter_losses,draws=red?b.red_fighter_draws:b.blue_fighter_draws,ranking=red?b.red_fighter_ranking:b.blue_fighter_ranking,slug=red?b.red_fighter_slug:b.blue_fighter_slug,recordText=record(wins,losses,draws);
 const started=!!slug&&(!!image||!!height||!!reach||!!stance||wins!==null&&wins!==undefined||losses!==null&&losses!==undefined||draws!==null&&draws!==undefined||!!ranking);
 const complete=!!slug&&!!height&&!!stance&&wins!==null&&wins!==undefined&&losses!==null&&losses!==undefined;
 const state=complete?"complete":started?"partial":"pending";
 const stateLabel=complete?"PROFILE ENRICHED":started?"PROFILE UPDATING":"ENRICHING PROFILE";
 return '<div class="fighter-card '+(red?"red":"blue")+'"><div class="fighter-head">'+(image?'<img src="'+esc(image)+'" alt="'+esc(name||"Fighter")+'" loading="lazy" onerror="this.style.display=\'none\'">':"")+'<div><div class="fighter-side">'+(red?"RED CORNER":"BLUE CORNER")+'</div><div class="fighter-name">'+esc(name||"TBD")+'</div><div class="fighter-record">'+esc(recordText)+'</div><div class="profile-live '+state+'"><span class="profile-dot"></span>'+stateLabel+'</div>'+(ranking?'<div class="fighter-rank">'+esc(ranking)+'</div>':"")+'</div></div><div class="tape"><div class="tape-item"><div class="tape-label">Height</div><div class="tape-value">'+esc(val(height))+'</div></div><div class="tape-item"><div class="tape-label">Reach</div><div class="tape-value">'+esc(val(reach))+'</div></div><div class="tape-item"><div class="tape-label">Stance</div><div class="tape-value">'+esc(val(stance))+'</div></div><div class="tape-item"><div class="tape-label">Record</div><div class="tape-value">'+esc(recordText)+'</div></div></div><div class="profile-source">'+(complete?"Cito fighter profile • live-enriched":started?"Cito fighter profile • enrichment in progress":"Cito fighter profile • waiting for enrichment")+'</div></div>';
}
function renderBout(b,intel={}){
 const order=String(b.bout_order||"").padStart(2,"0"),n=Number(b.bout_order||0)-1000,cardType=n<=5?"main":"prelim",badge=n===1?"<span class='card-badge'>MAIN EVENT</span>":n===2?"<span class='card-badge'>CO-MAIN</span>":"","result="b.winner?'<div class="result">'+esc(b.winner)+(b.method?" • "+esc(b.method):"")+(b.finish_round?" • R"+esc(b.finish_round):"")+(b.finish_time?" "+esc(b.finish_time):"")+'</div>':'<div class="result muted-result">'+esc(String(b.status||"SCHEDULED").toUpperCase())+'</div>';
 return '<article class="bout" data-card="'+cardType+'"><div class="bout-top"><div class="bout-order">CARD '+esc(order)+badge+'</div><div class="weight">'+esc(b.weight_class||"UFC BOUT")+'</div><div class="bout-status">'+esc(String(b.status||"SCHEDULED").toUpperCase())+'</div></div><div class="fighter-grid">'+fighterCard(b,"red")+'<div class="versus">VS</div>'+fighterCard(b,"blue")+'</div><div class="result-row">'+result+(b.referee?'<div class="sync-note">Referee: '+esc(b.referee)+'</div>':"")+fighterIntel(b.red_fighter_slug,intel.profiles||{},intel.stats||{},intel.fights||{})+fighterIntel(b.blue_fighter_slug,intel.profiles||{},intel.stats||{},intel.fights||{})+'</div></article>';
}
let liveTimer=null;
function liveValue(v){return v===undefined||v===null||v===""?"—":esc(v)}
function findLive(obj,keys){if(!obj||typeof obj!=="object")return null;for(const k of keys){if(obj[k]!==undefined&&obj[k]!==null)return obj[k]}for(const v of Object.values(obj)){if(v&&typeof v==="object"){const x=findLive(v,keys);if(x!==null)return x}}return null}
async function loadLiveCommand(){
 if(!eventRecord||!isUfc())return;
 const box=document.getElementById("live-command"); if(!box)return;
 try{
  const r=await fetch("https://api.citoapi.com/api/v1/ufc/live/events",{headers:{"Accept":"application/json"}});
  if(!r.ok){box.classList.remove("active");return}
  const p=await r.json(); const list=Array.isArray(p)?p:(p?.data||p?.events||[]);
  const ev=list.find(x=>String(x.eventSlug||x.slug||x.event_id||x.eventId||"").includes(String(eventRecord.provider_event_id||"")))||list.find(x=>String(x.title||"").toLowerCase().includes("rosas"));
  if(!ev){box.classList.remove("active");return}
  const bouts=ev.bouts||ev.activeBouts||[]; const b=bouts[0]; if(!b){box.classList.remove("active");return}
  const live=await fetch("https://api.citoapi.com/api/v1/ufc/live/"+encodeURIComponent(b.boutId||b.id||b.providerBoutId),{headers:{"Accept":"application/json"}});
  if(!live.ok){box.classList.remove("active");return}
  const data=await live.json(); const x=data?.data||data;
  const status=String(findLive(x,["status","state"])||"").toLowerCase();
  if(!["live","in_progress","inprogress","round"].some(v=>status.includes(v))){box.classList.remove("active");return}
  box.classList.add("active");
  document.getElementById("live-bout-title").textContent=String(findLive(x,["title","boutTitle"])||"LIVE BOUT");
  document.getElementById("live-clock").textContent=String(findLive(x,["clock","roundClock","time"])||"--:--");
  const round=findLive(x,["round","currentRound"]); document.getElementById("live-status").textContent="ROUND "+(round||"—")+" • "+(findLive(x,["lagSeconds"])??"—")+"s data lag";
  const rs=findLive(x,["red","redCorner","redFighter","red_stats"])||{}; const bs=findLive(x,["blue","blueCorner","blueFighter","blue_stats"])||{};
  const rsig=findLive(rs,["significantStrikes","sigStrikes","sig_strikes"]); const bsig=findLive(bs,["significantStrikes","sigStrikes","sig_strikes"]);
  document.getElementById("live-red-stat").textContent="RED • SIG STRIKES "+liveValue(rsig);
  document.getElementById("live-blue-stat").textContent="BLUE • SIG STRIKES "+liveValue(bsig);
 }catch(e){box.classList.remove("active")}
}
async function loadUfcFightCard(){
 const mount=document.getElementById("fightCardMount");mount.innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">SPORTS 23.1 • UFC FIGHT CARD</div><h2>Loading Fighter Profiles…</h2><p class="muted">Building individual fighter cards and tale-of-the-tape panels.</p></div>';
 let r=await sb.from("cr_sports_event_bouts").select("*").eq("event_id",eventRecord.id).order("bout_order",{ascending:true}),rows=r.data||[];
 if(r.error){mount.innerHTML='<div class="panel fight-card-panel"><h2>FIGHT CARD UNAVAILABLE</h2><p class="muted">'+esc(r.error.message)+'</p></div>';return;}
 let sync=null;
 if(shouldRefresh(rows)){sync=await syncUfcCard();if(sync?.ok){r=await sb.from("cr_sports_event_bouts").select("*").eq("event_id",eventRecord.id).order("bout_order",{ascending:true});rows=r.data||[];}}
 if(!rows.length){
   const detail=sync?.error?'<div class="sync-note" style="color:#ff7777">Cito sync error: '+esc(sync.error)+'</div>':"";
   mount.innerHTML='<div class="panel fight-card-panel"><div class="eyebrow">SPORTS 23.1 • UFC FIGHT CARD</div><h2>FIGHT CARD PENDING</h2><p class="muted">CrowRules has not stored any bouts for this event yet. The page attempted a live Cito sync.</p>'+detail+'<div class="actions"><button class="button" id="retryCito">RETRY CITO SYNC</button></div><div class="sync-note">Source: Cito UFC API • fighter profiles are cached server-side.</div></div>';
   document.getElementById("retryCito")?.addEventListener("click",async()=>{const b=document.getElementById("retryCito");b.disabled=true;b.textContent="SYNCING…";const s=await syncUfcCard();if(s?.ok){await loadUfcFightCard();}else{b.disabled=false;b.textContent="RETRY CITO SYNC";mount.querySelector(".sync-note").insertAdjacentHTML("beforeend",s?.error?'<div style="color:#ff7777;margin-top:8px">Cito sync error: '+esc(s.error)+'</div>':"");}});
   return;
 }
 const slugs=[...new Set(rows.flatMap(b=>[b.red_fighter_slug,b.blue_fighter_slug]).filter(Boolean))];const [pr,st,fh]=await Promise.all([sb.from("cr_sports_ufc_fighters").select("*").in("slug",slugs),sb.from("cr_sports_ufc_fighter_stats").select("*").in("slug",slugs),sb.from("cr_sports_ufc_fighter_fights").select("*").in("slug",slugs)]);const intel={profiles:Object.fromEntries((pr.data||[]).map(x=>[x.slug,x])),stats:Object.fromEntries((st.data||[]).map(x=>[x.slug,x])),fights:Object.fromEntries((fh.data||[]).map(x=>[x.slug,x]))};mount.innerHTML='<div class="panel fight-card-panel"><div class="fight-card-head"><div><div class="eyebrow">SPORTS 23.1 • UFC FIGHT CARD</div><h2>'+esc(eventRecord.title)+'</h2></div><div class="tag">'+rows.length+' BOUTS</div></div><p class="muted">Every matchup has a live Tale of the Tape with progressive fighter intelligence.</p><div class="progress-wrap"><div class="progress-top"><span>FIGHTER PROFILE ENRICHMENT</span><span>'+profileProgress(rows).complete+'/'+profileProgress(rows).total+' COMPLETE</span></div><div class="progress-track"><div class="progress-fill" style="width:'+profileProgress(rows).percent+'%"></div></div></div><div class="card-toolbar"><button class="card-filter active" data-filter="all">ALL BOUTS</button><button class="card-filter" data-filter="main">MAIN CARD</button><button class="card-filter" data-filter="prelim">PRELIMS</button></div><div id="live-command" class="live-strip"><div class="live-main"><div><div class="eyebrow">LIVE FIGHT COMMAND CENTER</div><div id="live-bout-title" class="live-round">LIVE BOUT</div></div><div id="live-clock" class="live-clock">--:--</div></div><div class="live-stats"><div class="live-stat" id="live-red-stat">RED —</div><div class="live-stat" id="live-blue-stat">BLUE —</div></div><div class="sync-note" id="live-status">Waiting for live Cito data…</div></div><div class="fight-card-grid">'+rows.map(b=>renderBout(b,intel)).join("")+'</div><div class="sync-note">Cito UFC API • profiles, career stats and fight history progressively cached in Supabase.</div></div>';bindCardFilters();
}
function tick(){const el=document.getElementById("countdown");if(!el||!eventRecord?.starts_at)return;const d=new Date(eventRecord.starts_at)-Date.now();if(d<=0){el.textContent="LIVE / STARTED";return;}const h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);el.textContent=h+"h "+String(m).padStart(2,"0")+"m "+String(s).padStart(2,"0")+"s";}
loadEvent();setInterval(tick,1000);
if(id){sb.channel("sports23-event-"+id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"cr_sports_events",filter:"id=eq."+id},p=>{if(p.new){eventRecord={...eventRecord,...p.new};renderEvent();}}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"cr_sports_event_bouts",filter:"event_id=eq."+id},()=>{if(isUfc())loadUfcFightCard();}).on("postgres_changes",{event:"*",schema:"public",table:"cr_sports_wrestling_matches",filter:"event_id=eq."+id},()=>{if(["WWE","AEW"].includes(String(eventRecord?.cr_sports_leagues?.code||"").toUpperCase()))loadWrestlingCard();}).on("postgres_changes",{event:"*",schema:"public",table:"cr_sports_ufc_fighter_stats"},()=>{if(isUfc())loadUfcFightCard();}).on("postgres_changes",{event:"*",schema:"public",table:"cr_sports_ufc_fighter_fights"},()=>{if(isUfc())loadUfcFightCard();}).subscribe();}
</script>
